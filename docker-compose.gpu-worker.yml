# Private network only. Set RENDER_WORKER_TOKEN and IMMICH_URL; publish on the GPU box deliberately.
services:
  gpu-worker:
    image: ghcr.io/sam-dumont/immich-video-memory-generator/inference:${IMMICH_MEMORIES_VERSION:-latest}-cuda
    command:
    - python
    - -m
    - immich_memories_inference.gpu_worker
    restart: unless-stopped
    ports:
    - ${GPU_WORKER_BIND_ADDRESS:-127.0.0.1}:8092:8092
    environment:
      IMMICH_MEMORIES_INFERENCE_HOST: 0.0.0.0
      IMMICH_MEMORIES_INFERENCE_CACHE_DIR: /cache
      IMMICH_MEMORIES_RENDER_WORKER_TOKEN: ${RENDER_WORKER_TOKEN:?Set the shared render
        token}
      IMMICH_MEMORIES_RENDER_WORKER_IMMICH_URL: ${IMMICH_URL:?Set the app's Immich
        URL}
      IMMICH_MEMORIES_RENDER_WORKER_DIRECTORY: /app/output/render-worker
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    volumes:
    - gpu-model-cache:/cache
    - gpu-render-scratch:/app/output
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - 'import os, urllib.request; urllib.request.urlopen(''http://localhost:8092/ping'',
        timeout=5).close(); request = urllib.request.Request(''http://localhost:8092/render/health'',
        headers={''Authorization'': ''Bearer '' + os.environ[''IMMICH_MEMORIES_RENDER_WORKER_TOKEN'']});
        urllib.request.urlopen(request, timeout=5).close()'
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  gpu-model-cache: null
  gpu-render-scratch: null
