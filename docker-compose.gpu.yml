# Add with -f docker-compose.gpu.yml. CPU images work; use the CUDA override for NVIDIA.
services:
  immich-memories:
    deploy:
      resources:
        limits:
          memory: 8G
    environment:
      IMMICH_MEMORIES_DEPLOYMENT_TIER: gpu
    depends_on:
      immich-memories-inference:
        condition: service_healthy
      immich-memories-captioner:
        condition: service_healthy
  immich-memories-inference:
    image: ghcr.io/sam-dumont/immich-memories/inference:${IMMICH_MEMORIES_VERSION:-latest}
    container_name: immich-memories-inference
    ports:
    - 127.0.0.1:8092:8092
    volumes:
    - immich-memories-model-cache:/cache
    environment:
      IMMICH_MEMORIES_INFERENCE_ALLOW_MODEL_DOWNLOADS: 'true'
      HF_HOME: /cache/huggingface
      IMMICH_MEMORIES_INFERENCE_IDLE_UNLOAD_SECONDS: '300'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8092/ping',
        timeout=5).close()
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
  immich-memories-caption-models:
    image: ghcr.io/ggml-org/llama.cpp:server-b10920
    container_name: immich-memories-caption-models
    entrypoint:
    - /bin/sh
    - -euc
    command:
    - |
      cd /models
      {
        echo "6f67b8036b2469fcd71728702720c6b51aebd759b78137a8120733b4d66438bc  SmolVLM2-500M-Video-Instruct-Q8_0.gguf"
        echo "921dc7e259f308e5b027111fa185efcbf33db13f6e35749ddf7f5cdb60ef520b  mmproj-SmolVLM2-500M-Video-Instruct-Q8_0.gguf"
      } > SHA256SUMS
      if sha256sum -c SHA256SUMS >/dev/null 2>&1; then
        echo "caption weights already present"
        exit 0
      fi
      base=https://huggingface.co/ggml-org/SmolVLM2-500M-Video-Instruct-GGUF/resolve/ccd7aae53bcb1997355c2f094959e72b3642ce17
      curl -fL --retry 3 -o SmolVLM2-500M-Video-Instruct-Q8_0.gguf "$$base/SmolVLM2-500M-Video-Instruct-Q8_0.gguf"
      curl -fL --retry 3 -o mmproj-SmolVLM2-500M-Video-Instruct-Q8_0.gguf "$$base/mmproj-SmolVLM2-500M-Video-Instruct-Q8_0.gguf"
      sha256sum -c SHA256SUMS
    volumes:
    - immich-memories-caption-models:/models
    restart: 'no'
    deploy:
      resources:
        limits:
          memory: 512M
  immich-memories-captioner:
    image: ghcr.io/ggml-org/llama.cpp:server-b10920
    container_name: immich-memories-captioner
    depends_on:
      immich-memories-caption-models:
        condition: service_completed_successfully
    ports:
    - 127.0.0.1:8094:8092
    volumes:
    - immich-memories-caption-models:/models:ro
    command:
    - --model
    - /models/SmolVLM2-500M-Video-Instruct-Q8_0.gguf
    - --mmproj
    - /models/mmproj-SmolVLM2-500M-Video-Instruct-Q8_0.gguf
    - --alias
    - smolvlm2-500m-base-public
    - --host
    - 0.0.0.0
    - --port
    - '8092'
    - --jinja
    - --ctx-size
    - '8192'
    - --cache-ram
    - '128'
    - --parallel
    - '1'
    - --threads
    - '4'
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8092/health
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G
volumes:
  immich-memories-model-cache: {}
  immich-memories-caption-models: {}
