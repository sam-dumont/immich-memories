# Advertised-feature inventory (#2128).
#
# One row per promise README.md or docs-site/docs makes to a user. Each row names the doc page that
# makes the promise and either:
#   tests:  the feature tests that check the promise against real output: the film, the printed
#           text, the files on disk, the page in the browser. Three forms:
#           - pytest: `tests/.../test_x.py::test_y`, marked @pytest.mark.feature("<row id>");
#           - Playwright: a `tests/e2e/` pytest node id, marked the same way, in a file `make e2e`
#             runs (the browser suite is pytest-playwright);
#           - Node: `docs-site/.../x.test.mjs::<test() title as written>`, with a
#             `// feature: <row id>` comment on the line above the test( call, in a file a
#             Makefile `node --test` line runs. A template-literal title keeps its `${...}`.
#   status: "lane_only: <reason>" when only real hardware, an OS scheduler, a cluster, a NAS, a model
#           service or the internet can prove it (the release lanes run those);
#   status: "gap: #<issue>" when nobody tests it yet.
#
# Flipping a gap: write the feature test, mark it with the row id, replace `status` with `tests`, and
# lower `gap_ceiling` to the new number of gap rows. The ceiling is a ratchet: it may fall, and only
# rises with a commit that says why.
#
# `covers` ties the row to what `make feature-check` enumerates from the code: every CLI command and
# option (`cli:<command path>` and `cli:<command path> <first option name>`), every offered memory
# type (`memory-type:<value>`) and every automation detector (`detector:<ClassName>`). A new command,
# flag, memory type or detector without a row fails the check.
#
# `doc` is relative to docs-site/docs/ (or README.md), with the heading anchor that makes the promise.

gap_ceiling: 47

