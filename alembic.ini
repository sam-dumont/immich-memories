# Dev only: the app runs the store's migrations itself (immich_memories.db.migrate) and never
# reads this file. It lets `alembic` write a new revision against a scratch store:
#
#   export IMMICH_MEMORIES_DATABASE_URL=sqlite:////tmp/store-dev.db
#   uv run alembic upgrade heads
#   uv run alembic revision --autogenerate --head 0001_foundation@head --rev-id 0002_people -m "people"
#
# See docs/designs/2026-09-27-the-store.md, "Adding a table".
[alembic]
script_location = src/immich_memories/db/migrations
file_template = %%(rev)s
