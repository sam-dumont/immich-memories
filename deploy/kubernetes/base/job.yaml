# Optional one-off CLI Job, enabled separately with `- job.yaml` in kustomization.yaml.
# Scale the Deployment to zero before starting this Job: it mounts the same SQLite PVC.
# Prefer `kubectl exec deploy/immich-memories -- immich-memories generate ...` when
# the Deployment is running. Never apply this file just to enable a schedule.
# Use cronjobs.yaml for HTTP triggers that keep the Deployment as the only writer.
# For GPU nodes copy the fields from ../components/gpu/deployment-gpu.yaml.
apiVersion: batch/v1
kind: Job
metadata:
  name: immich-memories-generate
  namespace: immich-memories
  labels:
    app.kubernetes.io/name: immich-memories
    app.kubernetes.io/component: batch-job
spec:
  ttlSecondsAfterFinished: 86400  # Clean up after 24 hours
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-memories
        app.kubernetes.io/component: batch-job
    spec:
      restartPolicy: OnFailure
      # Off everywhere the app runs: a Service named `immich-memories` injects
      # IMMICH_MEMORIES_SERVICE_HOST/PORT into a pod reading IMMICH_MEMORIES_*
      # otherwise (#1608).
      enableServiceLinks: false
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # Fetch missing configured models. The presence guard includes GPU detector files,
      # so NAS re-runs fetch at each start; fetch checks existing artifact digests.
      initContainers:
        - name: fetch-models
          image: ghcr.io/sam-dumont/immich-memories:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -c
            - >
              test -s /models/triage/dinov2-small.onnx
              && test -s /models/detectors/nsfw-marqo-384.onnx
              && test -d /models/huggingface
              && test -s /models/wordnet/wordnet.zip
              || immich-memories models fetch
          env:
            - name: IMMICH_MEMORIES_TRIAGE__ENCODER
              value: /models/triage/dinov2-small.onnx
            - name: IMMICH_MEMORIES_EDITORIAL__PREPARATION__MARQO_ONNX
              value: /models/detectors/nsfw-marqo-384.onnx
            - name: IMMICH_MEMORIES_EDITORIAL__PREPARATION__DETECTOR_CACHE_DIR
              value: /models/huggingface
            - name: IMMICH_MEMORIES_FREE_TEXT__WORDNET
              value: /models/wordnet/wordnet.zip
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          volumeMounts:
            # `models fetch` loads the config before it downloads anything, and that
            # wants HOME writable; the root filesystem here is not.
            - name: data
              mountPath: /home/immich/.immich-memories
            # The same claim keeps Torch/HF caches writable and persistent.
            - name: data
              mountPath: /home/immich/.cache
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      containers:
        - name: generate
          image: ghcr.io/sam-dumont/immich-memories:latest
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # Example: 10-minute 2024 spotlight for one person. --duration is seconds.
          command:
            - immich-memories
            - generate
            - --year
            - "2024"
            - --person
            - "Ada"
            - --duration
            - "600"
            - --output
            - /app/output/ada_2024_memories.mp4

          envFrom:
            - secretRef:
                name: immich-memories-secrets
          env:
            - name: IMMICH_MEMORIES_OUTPUT__DIRECTORY
              value: /app/output
            - name: IMMICH_MEMORIES_TIER
              value: auto
            - name: IMMICH_MEMORIES_TRIAGE__ENCODER
              value: /models/triage/dinov2-small.onnx
            - name: IMMICH_MEMORIES_EDITORIAL__PREPARATION__MARQO_ONNX
              value: /models/detectors/nsfw-marqo-384.onnx
            - name: IMMICH_MEMORIES_EDITORIAL__PREPARATION__DETECTOR_CACHE_DIR
              value: /models/huggingface
            - name: IMMICH_MEMORIES_FREE_TEXT__WORDNET
              value: /models/wordnet/wordnet.zip

          resources:
            requests:
              memory: "4Gi"
              cpu: "2000m"
            limits:
              memory: "16Gi"
              cpu: "8000m"

          volumeMounts:
            - name: data
              mountPath: /home/immich/.immich-memories
            # The same claim keeps Torch/HF caches writable and persistent.
            - name: data
              mountPath: /home/immich/.cache
            - name: output
              mountPath: /app/output
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-memories-cache
        - name: output
          persistentVolumeClaim:
            claimName: immich-memories-output
        - name: models
          persistentVolumeClaim:
            claimName: immich-memories-models
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
