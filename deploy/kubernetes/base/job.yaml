# CLI batch jobs. Optional: uncomment `- job.yaml` in kustomization.yaml or
# `kubectl apply -f job.yaml`.
#
# The store (config.yaml, cache.db, cache/annotations.sqlite) defaults to a
# SQLite file on the `data` PVC, opened by one writer at a time. A second pod
# writing that same file from another node over ReadWriteMany corrupts it: WAL
# mode needs shared memory a network filesystem does not give two hosts. So:
#
# - One-off custom runs (the `generate` Job below, with your own
#   --year/--person/...): the Deployment is already running the image with
#   the volumes mounted, so
#   `kubectl exec deploy/immich-memories -- immich-memories generate ...`
#   runs the same command with no second pod and no PVC conflict — prefer
#   that. The Job below is for a batch cluster where the Deployment stays
#   scaled to 0 between runs; only start it while the Deployment is down.
# - Scheduled runs (the two CronJobs below): they call the Deployment's HTTP
#   trigger API instead of running the CLI in a second pod, so the Deployment
#   stays the only writer and the CronJob pod never touches the PVCs. See
#   `IMMICH_MEMORIES_SERVER__TRIGGER_TOKEN`, `src/immich_memories/ui/trigger_api.py`
#   and docs-site/docs/make/automate.md#trigger-it-over-http. If the built-in
#   decision (whatever `auto run` would have picked) is all you want, the
#   in-process daily timer (`IMMICH_MEMORIES_AUTOMATION__ENABLED=true` on the
#   Deployment) does the same job with no CronJob at all.
#
# CPU by default. For GPU nodes add the fields from ../overlays/gpu/deployment-gpu.yaml
# (runtimeClassName, nvidia.com/gpu resources, nodeSelector, tolerations, NVIDIA_* env).
apiVersion: batch/v1
kind: Job
metadata:
  name: immich-memories-generate
  namespace: immich-memories
  labels:
    app.kubernetes.io/name: immich-memories
    app.kubernetes.io/component: batch-job
spec:
  ttlSecondsAfterFinished: 86400  # Clean up after 24 hours
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-memories
        app.kubernetes.io/component: batch-job
    spec:
      restartPolicy: OnFailure

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # A fresh models claim is empty, and prepare is where that shows up: the
      # first cut stopped naming three files nobody had been told to fetch. This
      # is the same image running the same `models fetch` a Docker user runs after
      # `up`, writing the pinned encoder, the pinned sensitive-content export and
      # the detector snapshot onto the claim. The guard is what makes a restart
      # free: a claim that already carries all three never goes back out.
      initContainers:
        - name: fetch-models
          image: ghcr.io/sam-dumont/immich-video-memory-generator:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -c
            - >
              test -s /models/triage/dinov2-small.onnx
              && test -s /models/detectors/nsfw-marqo-384.onnx
              && test -d /models/huggingface
              && test -s /models/wordnet/wordnet.zip
              || immich-memories models fetch
          env:
            - name: IMMICH_MEMORIES_TRIAGE__ENCODER
              value: /models/triage/dinov2-small.onnx
            - name: IMMICH_MEMORIES_EDITORIAL__PREPARATION__MARQO_ONNX
              value: /models/detectors/nsfw-marqo-384.onnx
            - name: IMMICH_MEMORIES_EDITORIAL__PREPARATION__DETECTOR_CACHE_DIR
              value: /models/huggingface
            - name: IMMICH_MEMORIES_FREE_TEXT__WORDNET
              value: /models/wordnet/wordnet.zip
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          volumeMounts:
            # `models fetch` loads the config before it downloads anything, and that
            # wants HOME writable; the root filesystem here is not.
            - name: data
              mountPath: /home/immich/.immich-memories
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      containers:
        - name: generate
          image: ghcr.io/sam-dumont/immich-video-memory-generator:latest
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # Example: 10-minute 2024 spotlight for one person. --duration is seconds.
          command:
            - immich-memories
            - generate
            - --year
            - "2024"
            - --person
            - "Alice"
            - --duration
            - "600"
            - --output
            - /app/output/alice_2024_memories.mp4

          envFrom:
            - secretRef:
                name: immich-memories-secrets
          env:
            - name: IMMICH_MEMORIES_OUTPUT__DIRECTORY
              value: /app/output
            - name: IMMICH_MEMORIES_TIER
              value: auto
            - name: IMMICH_MEMORIES_TRIAGE__ENCODER
              value: /models/triage/dinov2-small.onnx
            - name: IMMICH_MEMORIES_EDITORIAL__PREPARATION__MARQO_ONNX
              value: /models/detectors/nsfw-marqo-384.onnx
            - name: IMMICH_MEMORIES_EDITORIAL__PREPARATION__DETECTOR_CACHE_DIR
              value: /models/huggingface
            - name: IMMICH_MEMORIES_FREE_TEXT__WORDNET
              value: /models/wordnet/wordnet.zip

          resources:
            requests:
              memory: "4Gi"
              cpu: "2000m"
            limits:
              memory: "16Gi"
              cpu: "8000m"

          volumeMounts:
            - name: data
              mountPath: /home/immich/.immich-memories
            - name: output
              mountPath: /app/output
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-memories-cache
        - name: output
          persistentVolumeClaim:
            claimName: immich-memories-output
        - name: models
          persistentVolumeClaim:
            claimName: immich-memories-models
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
---
# CronJob: last month's highlights, 5 minutes, on the 1st of each month.
#
# `POST /api/trigger` takes no parameters: it runs whatever decision `auto
# run` would have made (the same rules, cooldown and history the daily timer
# uses), not this fixed "last month" command. That is on purpose — the route
# never runs an arbitrary command over HTTP. To keep this exact fixed
# schedule, point your own cron at
# `kubectl exec deploy/immich-memories -- immich-memories generate --start ... --end ...`
# instead; the Deployment is already the only writer, so that command needs
# no second pod. What is below is the common case: a schedule that is happy
# with whatever `auto run` decides.
#
# Needs `IMMICH_MEMORIES_SERVER__TRIGGER_TOKEN` set in base/secret.yaml (see
# secret.yaml.example) so the route answers a caller with no browser session.
# curl is pinned by digest, the same way docker-compose.yml pins the caption
# model puller.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-memories-monthly
  namespace: immich-memories
  labels:
    app.kubernetes.io/name: immich-memories
    app.kubernetes.io/component: cronjob
spec:
  schedule: "0 2 1 * *"  # 2 AM on the 1st of each month
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 604800  # 7 days
      template:
        metadata:
          labels:
            app.kubernetes.io/name: immich-memories
            app.kubernetes.io/component: cronjob
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 100
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: trigger
              image: docker.io/curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - curl
                - -fsS
                - -X
                - POST
                - http://immich-memories/api/trigger
                - -H
                - "x-api-key: $(TRIGGER_TOKEN)"
              env:
                - name: TRIGGER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: immich-memories-secrets
                      key: IMMICH_MEMORIES_SERVER__TRIGGER_TOKEN
              resources:
                requests:
                  memory: "16Mi"
                  cpu: "10m"
                limits:
                  memory: "32Mi"
                  cpu: "100m"
---
# CronJob: smart automation. `auto run` picks the best candidate (monthly,
# yearly, trip, person spotlight...), skips duplicates and respects cooldown —
# exactly what the trigger API runs, so this CronJob is a curl to the running
# Deployment, never a second pod running the CLI. Prefer the in-process daily
# timer (`IMMICH_MEMORIES_AUTOMATION__ENABLED=true` on the Deployment) over
# this CronJob unless you need a clock the Deployment's own process does not
# have, or want the schedule outside the pod spec.
#
# Needs `IMMICH_MEMORIES_SERVER__TRIGGER_TOKEN` set in base/secret.yaml (see
# secret.yaml.example).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-memories-auto
  namespace: immich-memories
  labels:
    app.kubernetes.io/name: immich-memories
    app.kubernetes.io/component: cronjob-auto
spec:
  schedule: "0 9 * * *"  # Daily at 9 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 604800  # 7 days
      template:
        metadata:
          labels:
            app.kubernetes.io/name: immich-memories
            app.kubernetes.io/component: cronjob-auto
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 100
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: trigger
              image: docker.io/curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - curl
                - -fsS
                - -X
                - POST
                - http://immich-memories/api/trigger
                - -H
                - "x-api-key: $(TRIGGER_TOKEN)"
              env:
                - name: TRIGGER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: immich-memories-secrets
                      key: IMMICH_MEMORIES_SERVER__TRIGGER_TOKEN
              resources:
                requests:
                  memory: "16Mi"
                  cpu: "10m"
                limits:
                  memory: "32Mi"
                  cpu: "100m"
