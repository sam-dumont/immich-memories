apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-memories
  namespace: immich-memories
  labels:
    app.kubernetes.io/name: immich-memories
    app.kubernetes.io/component: web-ui
spec:
  # Single-user, single-replica: workflow state lives in-process.
  replicas: 1
  strategy:
    type: Recreate  # both PVCs are ReadWriteOnce
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-memories
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-memories
        app.kubernetes.io/component: web-ui
    spec:
      # Kubernetes injects one env var per Service in the namespace by default
      # (SERVICE_HOST, SERVICE_PORT...); a Service named `immich-memories`
      # collides with this app's own IMMICH_MEMORIES_* prefix and the pod
      # fails to start. Off everywhere for the same reason (#1608).
      enableServiceLinks: false
      # Nothing here calls the Kubernetes API, so the pod carries no token for it.
      automountServiceAccountToken: false
      # The image runs as `immich`, UID/GID 1000, HOME=/home/immich.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # Fetch missing configured models. The presence guard includes GPU detector files,
      # so NAS re-runs fetch at each start; fetch checks existing artifact digests.
      initContainers:
        - name: fetch-models
          image: ghcr.io/sam-dumont/immich-memories:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -c
            - >
              test -s /models/triage/dinov2-small.onnx
              && test -s /models/detectors/nsfw-marqo-384.onnx
              && test -d /models/huggingface
              && test -s /models/wordnet/wordnet.zip
              || immich-memories models fetch
          env:
            # Pinned like the app container: unpinned, this log says "Tier auto resolved".
            - name: IMMICH_MEMORIES_DEPLOYMENT_TIER
              value: basic
            - name: IMMICH_MEMORIES_TRIAGE__ENCODER
              value: /models/triage/dinov2-small.onnx
            - name: IMMICH_MEMORIES_EDITORIAL__PREPARATION__MARQO_ONNX
              value: /models/detectors/nsfw-marqo-384.onnx
            - name: IMMICH_MEMORIES_EDITORIAL__PREPARATION__DETECTOR_CACHE_DIR
              value: /models/huggingface
            - name: IMMICH_MEMORIES_FREE_TEXT__WORDNET
              value: /models/wordnet/wordnet.zip
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          volumeMounts:
            # `models fetch` loads the config before it downloads anything, and that
            # wants HOME writable; the root filesystem here is not.
            - name: data
              mountPath: /home/immich/.immich-memories
            # The same claim keeps Torch/HF caches writable and persistent.
            - name: data
              mountPath: /home/immich/.cache
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      containers:
        - name: immich-memories
          # Tag is set by `images:` in kustomization.yaml
          image: ghcr.io/sam-dumont/immich-memories:latest
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # IMMICH_URL / IMMICH_API_KEY (and any other secret setting) come from
          # the Secret. Everything else is IMMICH_MEMORIES_<SECTION>__<KEY>.
          envFrom:
            - secretRef:
                name: immich-memories-secrets
          env:
            - name: IMMICH_MEMORIES_OUTPUT__DIRECTORY
              value: /app/output
            - name: IMMICH_MEMORIES_DEPLOYMENT_TIER
              value: basic
            - name: IMMICH_MEMORIES_TRIAGE__ENCODER
              value: /models/triage/dinov2-small.onnx
            - name: IMMICH_MEMORIES_EDITORIAL__PREPARATION__MARQO_ONNX
              value: /models/detectors/nsfw-marqo-384.onnx
            - name: IMMICH_MEMORIES_EDITORIAL__PREPARATION__DETECTOR_CACHE_DIR
              value: /models/huggingface
            - name: IMMICH_MEMORIES_FREE_TEXT__WORDNET
              value: /models/wordnet/wordnet.zip
            # Optional: text reader on an external Ollama server (32k context).
            # The app image has no owned llama-server. Replace the model/server names.
            # - name: IMMICH_MEMORIES_LLM__ENABLED
            #   value: "true"
            # - name: IMMICH_MEMORIES_LLM__PROVIDER
            #   value: "ollama"
            # - name: IMMICH_MEMORIES_LLM__BASE_URL
            #   value: "http://ollama:11434"
            # - name: IMMICH_MEMORIES_LLM__MODEL
            #   value: "your-32k-model"
            # - name: IMMICH_MEMORIES_LLM__EXTRA_PARAMS
            #   value: '{"options": {"num_ctx": 32768}}'
            # Optional: daily automation inside the pod (no CronJob needed)
            # - name: IMMICH_MEMORIES_AUTOMATION__ENABLED
            #   value: "true"
            # - name: IMMICH_MEMORIES_AUTOMATION__DAILY_AT
            #   value: "09:00"
            # - name: TZ
            #   value: "Europe/Brussels"

          # Idle ~100 MB; analysis 2-4 GB; FFmpeg assembly 4-8 GB (more for 4K).
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "8Gi"
              cpu: "4000m"

          volumeMounts:
            # config.yaml, cache.db, video cache, projects, automation history
            - name: data
              mountPath: /home/immich/.immich-memories
            # The same claim keeps Torch/HF caches writable and persistent.
            - name: data
              mountPath: /home/immich/.cache
            - name: output
              mountPath: /app/output
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp

          livenessProbe:
            httpGet:
              path: /health/live  # process is up
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # 503 until config is present and Immich answers; that keeps the pod
          # out of the Service while Immich is down (port-forward still works).
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-memories-cache
        - name: output
          persistentVolumeClaim:
            claimName: immich-memories-output
        - name: models
          persistentVolumeClaim:
            claimName: immich-memories-models
        # FFmpeg intermediates: 2Gi is enough for 1080p, use 8Gi for 4K.
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
