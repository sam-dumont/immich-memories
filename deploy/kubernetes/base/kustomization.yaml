apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: immich-memories

# CPU-only base that boots on any cluster:  kubectl apply -k base
# For NVIDIA nodes apply the overlay instead:  kubectl apply -k overlays/gpu
resources:
  - namespace.yaml
  # Create immich-memories-secrets separately; the base never stores credentials.
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  # Optional schedules: HTTP triggers only, no second SQLite writer.
  # - cronjobs.yaml
  # Optional one-off CLI Job: only while the Deployment is scaled to zero.
  # - job.yaml
  # Optional Ingress — only after enabling authentication:
  #   cp ingress.yaml.example ingress.yaml
  # - ingress.yaml

# Published image tags carry no `v` prefix: release `vX.Y.Z` ships as image tag `X.Y.Z`
# (plus `latest`). Releases land faster than this pin does — check it against the releases
# page before you apply, and bump it when you upgrade.
images:
  - name: ghcr.io/sam-dumont/immich-video-memory-generator
    newTag: "0.100.4"
