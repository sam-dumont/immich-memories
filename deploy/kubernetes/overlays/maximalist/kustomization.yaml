# The maximalist reference: every optional piece this project ships, composed
# on one cluster. Written up from a real deployment: OIDC behind a
# TLS-terminating proxy, a CUDA caption server, the render worker as a
# sidecar, a declarative config.yaml, an LLM on a LAN machine, an ACE-Step API
# server, geocoding and map tiles on, and cache caps sized to the PVC that
# holds them.
#
#   cd deploy/kubernetes
#   cp base/secret.yaml.example base/secret.yaml
#   cp overlays/render-sidecar/render-worker-secret.yaml.example overlays/render-sidecar/render-worker-secret.yaml
#   cp overlays/maximalist/maximalist-secret.yaml.example overlays/maximalist/maximalist-secret.yaml
#   vim base/secret.yaml overlays/render-sidecar/render-worker-secret.yaml \
#       overlays/maximalist/maximalist-secret.yaml overlays/maximalist/config-map.yaml
#   kubectl apply -k overlays/maximalist
#
# Walkthrough, hardware needed per piece, and the config keys:
# docs-site/docs/run/reference/cluster-example.md
#
# Composes ../render-sidecar (which itself pulls in ../../base),
# ../captioner-cuda and ../inference-cuda rather than duplicating any: patching Deployments
# and reusing a captioner overlay that already exists keeps one definition of
# "how the sidecar is wired" and one of "how the caption server takes a card".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: immich-memories

resources:
  - ../render-sidecar   # base + render worker sidecar, on the GPU node
  - ../captioner-cuda    # the caption server the full tier needs, on a card
  - ../inference-cuda    # the picture encoder, heads and detectors, on a card
  - config-map.yaml
  - networkpolicy-maximalist.yaml
  # cp maximalist-secret.yaml.example maximalist-secret.yaml and fill in.
  # kustomize refuses to build until the file exists.
  - maximalist-secret.yaml

patches:
  - path: deployment-maximalist.yaml

# Keep equal to base's own pin (render-sidecar's overlay already restates
# this for the same reason: a patch adding a container is not reached by a
# transformer that ran before the patch existed).
images:
  - name: ghcr.io/sam-dumont/immich-video-memory-generator
    newTag: "0.100.4"
