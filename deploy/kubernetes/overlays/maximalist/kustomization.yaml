# The maximalist reference: every optional piece this project ships, composed
# on one cluster. Written up from a real deployment: OIDC behind a
# TLS-terminating proxy, a CUDA caption server, the render worker as a
# sidecar, a declarative config.yaml, an LLM on a LAN machine, an ACE-Step API
# server, geocoding and map tiles on, and cache caps sized to the PVC that
# holds them.
#
# Like the base, this overlay stores no credentials: create its three Secrets
# from their examples first, then apply it.
#
#   cd deploy/kubernetes
#   kubectl apply -f base/namespace.yaml
#   for example in base/secret.yaml.example \
#       overlays/render-sidecar/render-worker-secret.yaml.example \
#       overlays/maximalist/maximalist-secret.yaml.example; do
#     secret_file=$(mktemp); cat "$example" > "$secret_file"
#     vim "$secret_file" && kubectl apply -f "$secret_file"; rm "$secret_file"
#   done
#   vim overlays/maximalist/config-map.yaml
#   kubectl apply -k overlays/maximalist
#
# Walkthrough, hardware needed per piece, and the config keys:
# docs-site/docs/run/reference/cluster-example.md
#
# Composes ../../base with the render-sidecar component, ../captioner-cuda and
# ../inference-cuda rather than duplicating any: patching Deployments and
# reusing a captioner overlay that already exists keeps one definition of "how
# the sidecar is wired" and one of "how the caption server takes a card".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: immich-memories

resources:
  - ../../base           # the app; its Secret is created separately
  - ../captioner-cuda    # the caption server the full tier needs, on a card
  - ../inference-cuda    # the picture encoder, heads and detectors, on a card
  - config-map.yaml
  - networkpolicy-maximalist.yaml

components:
  - ../../components/render-sidecar   # render worker sidecar, on the GPU node

patches:
  - path: deployment-maximalist.yaml

# Keep equal to base's own pin (the render-sidecar component restates it for
# the same reason: a patch adding a container is not reached by a transformer
# that ran before the patch existed).
images:
  - name: ghcr.io/sam-dumont/immich-memories
    newTag: "1.0.0-rc.12"
