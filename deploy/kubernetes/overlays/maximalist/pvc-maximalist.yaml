# Strategic-merge patch: the cache PVC sized for config-map.yaml's cache caps
# (5 GB video + 3 GB thumbnails), on top of config.yaml, store.db and
# automation history. The base's 20Gi already covers this; 10Gi is enough
# for exactly these two caps and leaves a note in the docs for a bigger
# library. See docs-site/docs/run/reference-setup.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-memories-cache
  namespace: immich-memories
spec:
  resources:
    requests:
      storage: 10Gi
