# NVIDIA GPU overlay: kubectl apply -k overlays/gpu
# Needs the GPU Operator (RuntimeClass `nvidia`, nvidia.com/gpu resources,
# nvidia.com/gpu.present node label). The app Secret must exist in the namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/gpu
