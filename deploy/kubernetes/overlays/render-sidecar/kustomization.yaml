# Render worker as a sidecar in the app pod, on a GPU node: kubectl apply -k overlays/render-sidecar
# base/secret.yaml and render-worker-secret.yaml must both exist first.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # cp render-worker-secret.yaml.example render-worker-secret.yaml and fill in
  # the token and Immich URL. kustomize refuses to build until the file exists.
  - render-worker-secret.yaml

patches:
  - path: deployment-sidecar.yaml

# The patch adds a second container the base's own `images:` pin (in
# ../../base/kustomization.yaml) does not reach, since base has already built
# by the time this overlay's patch runs. Keep this tag equal to base's own
# pin: the app refuses a worker on a different app version before it sends
# any footage.
images:
  - name: ghcr.io/sam-dumont/immich-video-memory-generator
    newTag: "0.100.4"
