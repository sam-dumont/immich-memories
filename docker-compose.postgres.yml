# Optional PostgreSQL store. Copy existing SQLite data before enabling this app URL.
services:
  immich-memories:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      IMMICH_MEMORIES_DATABASE_URL: postgresql+psycopg://immich_memories:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/immich_memories
  postgres:
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    environment:
      POSTGRES_USER: immich_memories
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: immich_memories
    volumes:
      - immich-memories-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U immich_memories -d immich_memories]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
volumes:
  immich-memories-postgres-data: {}
