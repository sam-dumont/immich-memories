version: 2
# Minor and patch updates arrive as one pull request per ecosystem per week; a major
# stays its own pull request. The majors ignored so far with `@dependabot ignore this
# major version` (huggingface-hub) are listed here too, so the rule lives in the repository
# and not only in a closed PR's comment.
# A Python bump also needs THIRD_PARTY_NOTICES regenerated: dependabot-notices.yml does it.
updates:
  - package-ecosystem: uv
    directory: /
    # Regenerate these coupled Torch/CUDA locks with make demucs-locks.
    exclude-paths:
      - "docker/demucs-*-requirements.txt"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "huggingface-hub"
        update-types: ["version-update:semver-major"]
      # 1.27+ needs CUDA 13; the CUDA image stays on CUDA 12 / cuDNN 9 (pyproject's
      # editorial-cuda pin, guarded by test_cuda_dependency_stays_compatible_with_cuda12).
      - dependency-name: "onnxruntime-gpu"
        versions: [">=1.27"]
  - package-ecosystem: npm
    directories:
      - /web
      - /docs-site
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # The Docusaurus packages move together, majors included.
      docusaurus:
        patterns:
          - "@docusaurus/*"
      # `core`, `resources` and `sdk-trace` peer-pin `api` to one minor, so any of them
      # bumped alone fails `npm ci` on a peer conflict. They move together, majors included.
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      # The order of the groups alone did not keep them apart (#2917), so say it outright.
      npm-minor-patch:
        update-types: [minor, patch]
        exclude-patterns:
          - "@opentelemetry/*"
  - package-ecosystem: github-actions
    # `/` covers .github/workflows only; the composite actions need their own entries.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    # The app's dependencies don't support a newer Python yet; 3.11.x patches still come.
    ignore:
      - dependency-name: "python"
        versions: [">=3.12"]
