version: 2
updates:
  - package-ecosystem: uv
    directory: /
    # Regenerate these coupled Torch/CUDA locks with make demucs-locks.
    exclude-paths:
      - "docker/demucs-*-requirements.txt"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directories:
      - /web
      - /docs-site
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
