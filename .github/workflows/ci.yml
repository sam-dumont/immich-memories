name: CI

on:
  # Every pull request, not only the ones aimed at main. A stacked PR targets the
  # branch below it, and a main-only filter meant those never ran CI at all —
  # they showed green because nothing had run.
  pull_request:
  # Every merge, unscoped: two PRs that were each green can break main together,
  # and main is what the release and the nightly build.
  push:
    branches: [main]
  workflow_call:  # Called by the release and the nightly, which run everything.

permissions:
  contents: read

# A pull request's new push cancels its older run. Anything else gets a group of
# its own run, so every merge to main and every release finishes its full run.
# Not `github.workflow`: in a called workflow that is the caller's name, which
# immich-gate.yml, called by the same release, would share.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# =============================================================================
# Job ordering: cheap → expensive. All quality gates run in parallel.
# Tests and Docker only run after quality gates pass.
#
# Each job runs only when the pull request touches what it can break
# (scripts/ci_scope.py, `make ci-scope`). A push to main and the release run
# every job. A job skipped by its `if:` reports as passing; `CI Success` is the
# check branch protection requires, so the set of jobs can change without a
# required check going missing.
# =============================================================================

jobs:
  # ── Tier 0: Change scope and cache setup ──────────────────────────────────
  changes:
    name: Change Scope
    if: github.repository_id == '1174219883'
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      docs_site: ${{ steps.scope.outputs.docs_site }}
      store: ${{ steps.scope.outputs.store }}
      container: ${{ steps.scope.outputs.container }}
      python: ${{ steps.scope.outputs.python }}
      unit: ${{ steps.scope.outputs.unit }}
      package: ${{ steps.scope.outputs.package }}
      launch: ${{ steps.scope.outputs.launch }}
      render_worker: ${{ steps.scope.outputs.render_worker }}
      extras: ${{ steps.scope.outputs.extras }}
      unit_matrix: ${{ steps.scope.outputs.unit_matrix }}
      integration_suites: ${{ steps.scope.outputs.integration_suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the diff needs the base branch
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: origin/${{ github.base_ref }}
        run: make ci-scope CI_SCOPE_EVENT="$EVENT" CI_SCOPE_BASE="$BASE"

  setup:
    name: Setup Cache
    runs-on: ubuntu-24.04
    if: github.repository_id == '1174219883'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install: dev-ci

  # ── Tier 1: Quality gates ─────────────────────────────────────────────────
  # One job, not thirteen. Each gate takes 10-35s but held its own runner slot,
  # and the account gets 20 concurrent jobs: with several PRs in flight, ~65
  # slots were occupied by half-minute jobs while the test matrix queued behind
  # them and got reclaimed mid-run. Sequenced here they cost the same four
  # minutes of work and one slot, and `make dev-ci` runs once instead of
  # thirteen times.
  #
  # Every gate runs even after one fails (`!cancelled()`), so a red build still
  # reports all of them at once, the way thirteen parallel jobs did.
  quality:
    name: Quality Gates
    if: github.repository_id == '1174219883'
    needs: [setup]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # commitlint needs the base branch
      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install: dev-ci

      - name: Ruff check
        if: '!cancelled()'
        run: make lint
      - name: Ruff format check
        if: '!cancelled()'
        run: make format-check
      - name: CLI reference drift
        if: '!cancelled()'
        run: make docs-cli-check
      - name: Config reference drift
        if: '!cancelled()'
        run: make docs-config-check
      - name: Feature inventory drift
        if: '!cancelled()'
        run: make feature-check
      - name: Documentation voice
        if: '!cancelled()'
        run: make docs-voice
      - name: Docs diagrams drift
        if: '!cancelled()'
        run: make docs-diagrams-check
      - name: Third-party notices drift
        if: '!cancelled()'
        run: make notices-check
      - name: Type Check (mypy)
        if: '!cancelled()'
        run: make typecheck
      - name: Dead Code (Vulture)
        if: '!cancelled()'
        run: make dead-code
      - name: Cyclomatic Complexity (Xenon)
        if: '!cancelled()'
        run: make complexity
      - name: Cognitive Complexity
        if: '!cancelled()'
        run: make cognitive-complexity
      - name: File Length (≤800 lines)
        if: '!cancelled()'
        run: make file-length
      - name: Modernization (refurb)
        if: '!cancelled()'
        run: make refurb
      - name: Dependency Hygiene (deptry)
        if: '!cancelled()'
        run: make dep-check
      - name: Architecture (import-linter)
        if: '!cancelled()'
        run: make arch-check
      - name: Private imports
        if: '!cancelled()'
        run: make private-imports
      - name: Code Duplication (≤5%)
        if: '!cancelled()'
        run: make duplication
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web client (types, contract, a fresh build, Immich brand assets)
        if: '!cancelled()'
        run: make web-check
      - name: AI Smell Audit
        if: '!cancelled()'
        run: make critique
      # Keep this in quality so docs-only and release workflow calls check it too.
      # ubuntu-24.04 ships the
      # compose plugin, and `config` parses without touching the daemon.
      - name: Compose file stands alone
        if: '!cancelled()'
        run: make compose-check
      - name: Commit Messages
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: COMMIT_RANGE="origin/${{ github.base_ref }}..HEAD" make commitlint

  # ── Tier 1: Security (parallel with quality gates) ────────────────────────
  security:
    name: Security Scan
    if: github.repository_id == '1174219883'
    needs: [setup]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install: dev-ci

      - name: Bandit (Python SAST)
        run: make bandit-ci

      - name: Semgrep (cross-file SAST)
        if: env.SEMGREP_APP_TOKEN != ''
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: "p/python p/owasp-top-ten p/security-audit"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Semgrep (local, no token)
        if: env.SEMGREP_APP_TOKEN == ''
        run: make semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: pip-audit (dependency CVEs)
        run: make pip-audit

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: npm audit (client and documentation)
        run: make npm-audit

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

      - name: Install Gitleaks (same version as pre-commit)
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "$archive"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Gitleaks (secret detection)
        run: make secret-scan

      - name: Hadolint (Dockerfile)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/Dockerfile
          config: .hadolint.yaml
          failure-threshold: error

      - name: Upload Bandit report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  # ── Tier 2: Tests (after all quality gates pass) ──────────────────────────
  # The unit suite on every Python/OS cell the scope runs, each cell in shards:
  # `make test-cov-xml TEST_SHARD=i/N` runs about 1/N of the test files, balanced on
  # the seconds each took (scripts/shard_tests.py, tests/shard_durations.json). The
  # cells, the shard count and the coverage cell come from `make ci-scope`
  # (scripts/ci_scope.py): see there why a pull request runs one macOS cell.
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shards }})
    if: github.repository_id == '1174219883' && needs.changes.outputs.unit == 'true'
    needs: [changes, setup]
    # uv follows .python-version (3.12) unless told otherwise, so without this every cell
    # ran 3.12 and 3.11, the Python the app image ships, was never tested.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # A shard fits in 20 minutes. Main and release run a cell whole (one shard), and the
    # whole suite on a macOS runner took 21 minutes on 2026-10-13, so it gets 40.
    timeout-minutes: ${{ matrix.shards == 1 && 40 || 20 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.unit_matrix) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # hatch-vcs versions the install from the tags

      # WHY: LFS bandwidth is metered — caching avoids re-downloading 13MB of
      # fixtures on every CI run (~9 LFS checkouts/push was burning 1GB/month).
      - name: Pull LFS files
        uses: ./.github/actions/pull-lfs

      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FFmpeg
        uses: ./.github/actions/install-ffmpeg

      - run: make dev-test

      # On pytest-xdist workers, one per core: TEST_WORKERS is `auto` when CI=true.
      # pytest-cov combines the workers' data into .coverage; the coverage job
      # combines the shards' and checks the floor on the whole suite.
      - name: Run tests with coverage
        run: make test-cov-xml TEST_SHARD=${{ matrix.shard }}/${{ matrix.shards }}

      - name: Keep this shard's coverage data
        if: matrix.coverage
        run: mkdir -p coverage-data && cp .coverage "coverage-data/.coverage.unit-${{ matrix.shard }}"

      - name: Upload this shard's coverage data
        if: matrix.coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-unit-${{ matrix.shard }}
          path: coverage-data/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        if: ${{ !cancelled() && matrix.coverage }}
        with:
          files: junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          fail_ci_if_error: false

  # WHY: diff-cover merges tests/*-coverage.xml, but those are gitignored and so can
  # never arrive from a contributor's machine; code only reachable through FFmpeg would
  # always read as uncovered. A pull request runs the FFmpeg integration suites its
  # changed source reaches (scripts/ci_scope.py picks them), one job per suite, beside
  # the unit shards. An unrelated pull request runs none; main and the release run the
  # integration suites on the GPU runner (integration.yml).
  integration-coverage:
    name: Integration Coverage (${{ matrix.suite }})
    if: >-
      github.repository_id == '1174219883'
      && needs.changes.outputs.integration_suites != '[]'
    needs: [changes, setup]
    env:
      UV_PYTHON: "3.12"  # the coverage cell's Python
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.integration_suites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull LFS files
        uses: ./.github/actions/pull-lfs
      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        uses: ./.github/actions/install-ffmpeg
      - name: Integration suite (${{ matrix.suite }})
        run: make dev-test-integration test-integration-${{ matrix.suite }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-integration-${{ matrix.suite }}
          path: tests/*-coverage.xml
          retention-days: 1
          if-no-files-found: error

  # The unit shards' coverage as one (`make coverage-combine`): the 65% floor on the
  # whole suite, and coverage.xml for Codecov. On a pull request, the ≥80% gate on the
  # changed lines, with the integration suites' XMLs merged in. It runs once every
  # shard passed; a failed shard fails CI Success by itself.
  coverage:
    name: Coverage
    if: >-
      github.repository_id == '1174219883' && !cancelled()
      && needs.changes.outputs.unit == 'true'
      && needs.test.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.integration-coverage.result)
    needs: [changes, test, integration-coverage]
    env:
      UV_PYTHON: "3.12"  # the coverage cell's Python
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history for diff-cover
      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python
        with:
          python-version: "3.12"
      - run: make dev-test

      - name: Download the unit shards' coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-unit-*
          path: coverage-data
          merge-multiple: true
      - name: Download the integration suites' coverage
        if: needs.integration-coverage.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-integration-*
          path: tests
          merge-multiple: true

      - name: Combined coverage (the floor on the whole suite)
        run: make coverage-combine

      - name: Diff coverage (≥80% on changed lines)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make diff-cover-ci

          # Post diff-cover report as PR comment
          COVERAGE_FILES="coverage.xml"
          for f in tests/*-coverage.xml; do
            [ -f "$f" ] && COVERAGE_FILES="$COVERAGE_FILES $f"
          done
          uvx diff-cover $COVERAGE_FILES --compare-branch=origin/main --format markdown:diff-cover-report.md || true
          if [ -s diff-cover-report.md ]; then
            # GitHub caps a comment body at 65,536 characters; a wide PR's per-file
            # report exceeds it, so keep the summary lines and cut the middle.
            {
              echo "## Diff Coverage Report"
              echo ""
              if [ "$(wc -c < diff-cover-report.md)" -gt 60000 ]; then
                head -c 50000 diff-cover-report.md
                echo ""
                echo ""
                echo "_… report truncated; full output is in the job log …_"
                echo ""
                tail -n 8 diff-cover-report.md
              else
                cat diff-cover-report.md
              fi
            } > diff-cover-comment.md
            # --edit-last updates existing comment instead of spamming new ones.
            # The gate already passed above; a failed comment must not fail the job.
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body-file diff-cover-comment.md --edit-last \
              || gh pr comment "${{ github.event.pull_request.number }}" \
              --body-file diff-cover-comment.md \
              || echo "::warning::could not post the diff-cover comment"
          else
            echo "diff-cover-report.md is empty, skipping PR comment"
          fi

      - name: Upload unit test coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        with:
          files: coverage.xml
          flags: unittests
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-extras:
    name: Test Extras (${{ matrix.os }})
    if: github.repository_id == '1174219883' && needs.changes.outputs.extras == 'true'
    needs: [changes, setup]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only the extras with tests marked `extras` (the torch family);
          # everything else runs in the main `test` job.
          - os: ubuntu-24.04
            extras: "dev"
          - os: macos-latest
            extras: "dev,mac"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull LFS files
        uses: ./.github/actions/pull-lfs
      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python
        with:
          python-version: "3.13"
          cache-suffix: extras

      - name: Install FFmpeg
        uses: ./.github/actions/install-ffmpeg

      - name: Install with extras
        run: |
          IFS=',' read -ra EXTRAS <<< "${{ matrix.extras }}"
          ARGS=""
          for extra in "${EXTRAS[@]}"; do
            ARGS="$ARGS --extra $extra"
          done
          uv sync $ARGS

      - run: make test-extras

  # The store suite on PostgreSQL as well as SQLite (#871). Only tests/store/: the
  # repositories are what has to behave the same on both backends.
  test-store:
    name: Test Store (SQLite + PostgreSQL)
    if: github.repository_id == '1174219883' && needs.changes.outputs.store == 'true'
    needs: [changes, setup]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: docker.io/library/postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_PASSWORD: store-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install: dev-ci
      # The backup drill runs pg_dump/pg_restore against the postgres:16 service above: install
      # exactly that major from PGDG instead of trusting whatever the runner image ships.
      - name: PostgreSQL 16 client
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: The client is 16
        run: |
          pg_dump --version
          pg_dump --version | grep -Eq ' 16\.' || { echo "pg_dump is not 16"; exit 1; }
          pg_restore --version | grep -Eq ' 16\.' || { echo "pg_restore is not 16"; exit 1; }
      - run: make test-store
        env:
          IMMICH_MEMORIES_TEST_DATABASE_URL: postgresql://postgres:store-test@127.0.0.1:5432/postgres

  # Integration tests run LOCALLY via pre-commit hook (not in CI — too slow).
  # Triggered by changes to src/immich_memories/(processing|titles)/ or tests/integration/.
  # Run manually: make test-integration

  # ── Tier 3: Build + Docker (most expensive, after tests) ─────────────────
  build:
    name: Build Package
    # Runs beside the tests, not after them: the wheel, image and container checks
    # are their own gates, and CI Success fails the run when any job fails.
    if: >-
      github.repository_id == '1174219883' && !cancelled()
      && needs.changes.outputs.package == 'true'
    needs: [changes]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv python install ${{ env.PYTHON_VERSION }}
      # The wheel carries the built web client, which is not committed (#1580).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make build
      - name: Check package
        run: make build-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-ci
          path: dist/

  docker:
    name: Docker (${{ matrix.platform }})
    needs: [changes]
    runs-on: ${{ matrix.runner }}
    if: github.repository_id == '1174219883' && needs.changes.outputs.container == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=0+g${{ github.sha }}
            INSTALL_EXTRAS=all
            VCS_REF=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          # No gha layer cache: the Dockerfile copies src/ and takes APP_VERSION
          # before every heavy RUN, so no commit reuses a layer (0 CACHED steps
          # measured, #1272), while exporting cost ~140 s per job and ~3 GB of
          # the repo's 10 GB Actions cache per PR, evicting caches that do hit.

  # The image the docker job only builds, run: rebuilt here with the editorial
  # extra (the docker job's `all` build is several GB and never leaves its
  # runner), started from docker-compose.yml on a volume a pre-store install
  # left, then `store backup`/`restore` inside it and the trigger API called as
  # the Kubernetes CronJob calls it. The postgresql leg switches on the compose
  # file's own PostgreSQL example, so that example is what gets tested. Runs when
  # the image, its deployment or the store it backs up changes.
  container-e2e:
    name: Container E2E (${{ matrix.database }})
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: >-
      github.repository_id == '1174219883'
      && (needs.changes.outputs.container == 'true' || needs.changes.outputs.store == 'true')
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install: dev-ci
      - name: Build the image
        run: make test-container-image
      - name: Container E2E (${{ matrix.database }})
        run: make test-container CONTAINER_E2E_DATABASE=${{ matrix.database }} CONTAINER_E2E_BUILD=0
      - name: Upload container diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-e2e-${{ matrix.database }}
          if-no-files-found: ignore
          path: tests/container-*-junit.xml

  docs:
    name: Docs Build
    env:
      # Exercise configured analytics without using the production collector.
      DOCS_ANALYTICS_DOMAIN: docs.example.com
      DOCS_ANALYTICS_ENDPOINT: https://metrics.example.com/api/event
    if: github.repository_id == '1174219883' && needs.changes.outputs.docs_site == 'true'
    needs: [changes]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull LFS files
        uses: ./.github/actions/pull-lfs
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: cd docs-site && npm ci
      - run: make docs-check

  # A docs-only pull request skips the test matrix. The tests that read the changed
  # pages still run: scripts/hook_scope.py picks them, as it does for the pre-commit
  # hook (by path or file name, plus the tests that walk the repository).
  docs-tests:
    name: Docs Contract Tests
    if: github.repository_id == '1174219883' && needs.changes.outputs.docs_only == 'true'
    needs: [changes, setup]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the selection reads the diff against the base branch
      - name: Pull LFS files
        uses: ./.github/actions/pull-lfs
      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        uses: ./.github/actions/install-ffmpeg
      - run: make dev-test
      - name: Tests that read the changed pages
        env:
          BASE: origin/${{ github.base_ref }}
        run: make test-scoped HOOK_SCOPE_BASE="$BASE"

  # The launch check's e2e suite with the app's store on each backend; the PostgreSQL
  # legs run when the store changes. Each backend runs in two shards: `make e2e` with
  # E2E_SHARD=i/2 runs about half the files, balanced on the seconds each took
  # (scripts/shard_tests.py, tests/shard_durations.json). Whole files, because the page
  # tests reuse what their worker's session rendered. `ci-success` fails when any leg fails.
  launch-check:
    name: Hermetic Launch Check (${{ matrix.database }}, ${{ matrix.shard }}/2)
    needs: [changes, setup]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Every event the scope allows: a pull request that touches what it runs, a
    # push to main, the release and the nightly.
    if: github.repository_id == '1174219883' && needs.changes.outputs.launch == 'true'
    strategy:
      fail-fast: false
      matrix:
        database: ${{ fromJSON(needs.changes.outputs.store == 'true' && '["sqlite","postgresql"]' || '["sqlite"]') }}
        shard: [1, 2]
    # Started on every leg (services cannot follow the matrix); only the
    # postgresql legs are given its URL. Pinned like the test-store job's.
    services:
      postgres:
        image: docker.io/library/postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_PASSWORD: store-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # hatch-vcs versions the install from the tags
      - name: Set up the suite
        uses: ./.github/actions/setup-launch-suite
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install: dev-test
          browser: 'true'
      - name: Run launch readiness gate (SQLite)
        if: matrix.database == 'sqlite'
        run: make launch-check-ci E2E_SHARD=${{ matrix.shard }}/2
      - name: Run launch readiness gate (PostgreSQL)
        if: matrix.database == 'postgresql'
        run: make launch-check-ci-postgres E2E_SHARD=${{ matrix.shard }}/2
        env:
          IMMICH_MEMORIES_E2E_DATABASE_URL: postgresql://postgres:store-test@127.0.0.1:5432/postgres
      - name: Upload launch diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launch-check-diagnostics-${{ matrix.database }}-${{ matrix.shard }}
          if-no-files-found: ignore
          path: |
            tests/e2e-junit.xml
            /tmp/pytest-of-runner/**/server.log
            /tmp/pytest-of-runner/**/output-probe.json
            /tmp/pytest-of-runner/**/launch-smoke*/output/**

  # The advertised features on the fixture library, through the real CLI and FFmpeg
  # (tests/integration/features/, four xdist workers per job), in three shards picked the
  # same way as the e2e ones. One store backend: the store is not their subject.
  features:
    name: Feature Tests (${{ matrix.shard }}/3)
    needs: [changes, setup]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.repository_id == '1174219883' && needs.changes.outputs.launch == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # hatch-vcs versions the install from the tags
      - name: Set up the suite
        uses: ./.github/actions/setup-launch-suite
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install: dev-test-features
      - name: Run feature tests (fixture library)
        run: make test-features FEATURE_SHARD=${{ matrix.shard }}/3
      - name: Upload feature diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feature-diagnostics-${{ matrix.shard }}
          if-no-files-found: ignore
          path: |
            tests/features-junit.xml
            /tmp/pytest-of-runner/**/server.log

  # The render worker's own lint, types, suite and package. It imports titles and
  # processing from the app, so the scope runs it for those too.
  render-worker:
    name: Render Worker
    if: github.repository_id == '1174219883' && needs.changes.outputs.render_worker == 'true'
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: services/render-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv python install 3.13
      - run: make dev-ci
      - uses: ./.github/actions/install-ffmpeg
      - run: >-
          make lint format-check typecheck security-lint
          SERVICE_TREES=services/render-worker
          SERVICE_PACKAGES=services/render-worker/immich_memories_render_worker
      - run: make -C services/render-worker coverage
      - run: make -C services/render-worker package

  # ── Summary gate ──────────────────────────────────────────────────────────
  # The one check branch protection requires. A job the change scope skipped
  # reports "skipped"; one skipped because a job it needs failed is caught by
  # that job's own result. "cancelled" fails: a job past its timeout-minutes
  # ends cancelled, and a superseded run's verdict no longer counts anyway.
  ci-success:
    name: CI Success
    needs: [changes, setup, quality, security, test, integration-coverage, coverage, test-extras, test-store, build, docker, container-e2e, docs, docs-tests, launch-check, features, render-worker]
    runs-on: ubuntu-24.04
    if: always() && github.repository_id == '1174219883'
    steps:
      - name: Check all jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          for job in changes setup; do
            result=$(jq -r --arg job "$job" '.[$job].result' <<< "$RESULTS")
            [[ "$result" == "success" ]] || { echo "$job did not succeed: $result"; exit 1; }
          done
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "$RESULTS")
          if [[ -n "$failed" ]]; then
            echo "$failed"
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          echo "All jobs passed!"
