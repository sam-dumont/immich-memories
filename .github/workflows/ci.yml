name: CI

on:
  # Every pull request, not only the ones aimed at main. A stacked PR targets the
  # branch below it, and a main-only filter meant those never ran CI at all —
  # they showed green because nothing had run.
  pull_request:
  workflow_call:  # Called by the manually dispatched release workflow.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# =============================================================================
# Job ordering: cheap → expensive. All quality gates run in parallel.
# Tests and Docker only run after quality gates pass.
#
# Each job runs only when the pull request touches what it can break
# (scripts/ci_scope.py, `make ci-scope`). A job skipped by its `if:` reports as
# passing; `CI Success` is the check branch protection requires, so the set of
# jobs can change without a required check going missing.
# =============================================================================

jobs:
  # ── Tier 0: Change scope and cache setup ──────────────────────────────────
  changes:
    name: Change Scope
    if: github.repository_id == '1174219883'
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      docs_site: ${{ steps.scope.outputs.docs_site }}
      store: ${{ steps.scope.outputs.store }}
      container: ${{ steps.scope.outputs.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the diff needs the base branch
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: origin/${{ github.base_ref }}
        run: make ci-scope CI_SCOPE_EVENT="$EVENT" CI_SCOPE_BASE="$BASE"

  setup:
    name: Setup Cache
    runs-on: ubuntu-24.04
    if: github.repository_id == '1174219883'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          prune-cache: false
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: make dev-ci

  # ── Tier 1: Quality gates ─────────────────────────────────────────────────
  # One job, not thirteen. Each gate takes 10-35s but held its own runner slot,
  # and the account gets 20 concurrent jobs: with several PRs in flight, ~65
  # slots were occupied by half-minute jobs while the test matrix queued behind
  # them and got reclaimed mid-run. Sequenced here they cost the same four
  # minutes of work and one slot, and `make dev-ci` runs once instead of
  # thirteen times.
  #
  # Every gate runs even after one fails (`!cancelled()`), so a red build still
  # reports all of them at once, the way thirteen parallel jobs did.
  quality:
    name: Quality Gates
    if: github.repository_id == '1174219883'
    needs: [setup]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # commitlint needs the base branch
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          prune-cache: false
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: make dev-ci

      - name: Ruff check
        if: '!cancelled()'
        run: make lint
      - name: Ruff format check
        if: '!cancelled()'
        run: make format-check
      - name: CLI reference drift
        if: '!cancelled()'
        run: make docs-cli-check
      - name: Config reference drift
        if: '!cancelled()'
        run: make docs-config-check
      - name: Documentation voice
        if: '!cancelled()'
        run: make docs-voice
      - name: Docs diagrams drift
        if: '!cancelled()'
        run: make docs-diagrams-check
      - name: Third-party notices drift
        if: '!cancelled()'
        run: make notices-check
      - name: Type Check (mypy)
        if: '!cancelled()'
        run: make typecheck
      - name: Dead Code (Vulture)
        if: '!cancelled()'
        run: make dead-code
      - name: Cyclomatic Complexity (Xenon)
        if: '!cancelled()'
        run: make complexity
      - name: Cognitive Complexity
        if: '!cancelled()'
        run: make cognitive-complexity
      - name: File Length (≤800 lines)
        if: '!cancelled()'
        run: make file-length
      - name: Modernization (refurb)
        if: '!cancelled()'
        run: make refurb
      - name: Dependency Hygiene (deptry)
        if: '!cancelled()'
        run: make dep-check
      - name: Architecture (import-linter)
        if: '!cancelled()'
        run: make arch-check
      - name: Code Duplication (≤5%)
        if: '!cancelled()'
        run: make duplication
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web client (types, contract, a fresh build, Immich brand assets)
        if: '!cancelled()'
        run: make web-check
      - name: AI Smell Audit
        if: '!cancelled()'
        run: make critique
      # Keep this in quality so docs-only and release workflow calls check it too.
      # ubuntu-24.04 ships the
      # compose plugin, and `config` parses without touching the daemon.
      - name: Compose file stands alone
        if: '!cancelled()'
        run: make compose-check
      - name: Commit Messages
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: COMMIT_RANGE="origin/${{ github.base_ref }}..HEAD" make commitlint

  # ── Tier 1: Security (parallel with quality gates) ────────────────────────
  security:
    name: Security Scan
    if: github.repository_id == '1174219883'
    needs: [setup]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          prune-cache: false
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: make dev-ci

      - name: Bandit (Python SAST)
        run: make bandit-ci

      - name: Semgrep (cross-file SAST)
        if: env.SEMGREP_APP_TOKEN != ''
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: "p/python p/owasp-top-ten p/security-audit"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Semgrep (local, no token)
        if: env.SEMGREP_APP_TOKEN == ''
        run: make semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: pip-audit (dependency CVEs)
        run: make pip-audit

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: npm audit (client and documentation)
        run: make npm-audit

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

      - name: Install Gitleaks (same version as pre-commit)
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "$archive"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Gitleaks (secret detection)
        run: make secret-scan

      - name: Hadolint (Dockerfile)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/Dockerfile
          config: .hadolint.yaml
          failure-threshold: error

      - name: Upload Bandit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  # ── Tier 2: Tests (after all quality gates pass) ──────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    if: github.repository_id == '1174219883'
    needs: [changes, quality, security]
    # uv follows .python-version (3.12) unless told otherwise, so without this every cell
    # ran 3.12 and 3.11, the Python the app image ships, was never tested.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # A docs-only change still runs the suite, since ~20 contract tests read
      # docs, manifests and workflows, but on one cell: the Python/OS grid exists
      # to catch code that behaves differently there, and a docs page cannot.
      # 3.12 on ubuntu is the cell that uploads coverage.
      #
      # WHY the event-dependent matrix: this repo is public, so hosted runners
      # are free but capped, and macOS is capped at 5 concurrent jobs. Three
      # macOS cells per pull request meant ~30 jobs queueing for 5 slots once a
      # handful of PRs were open; runs sat for hours and GitHub reclaimed them
      # mid-job ("runner has received a shutdown signal", then Error 137).
      # Ubuntu keeps every Python; macOS keeps one per PR and the full grid on
      # main, where runs are serialised anyway.
      matrix: ${{ fromJSON(needs.changes.outputs.docs_only == 'true'
        && '{"include":[{"os":"ubuntu-24.04","python-version":"3.12"}]}'
        || github.event_name == 'pull_request'
        && '{"include":[{"os":"ubuntu-24.04","python-version":"3.11"},{"os":"ubuntu-24.04","python-version":"3.12"},{"os":"ubuntu-24.04","python-version":"3.13"},{"os":"macos-latest","python-version":"3.13"}]}'
        || '{"include":[{"os":"ubuntu-24.04","python-version":"3.11"},{"os":"ubuntu-24.04","python-version":"3.12"},{"os":"ubuntu-24.04","python-version":"3.13"},{"os":"macos-latest","python-version":"3.11"},{"os":"macos-latest","python-version":"3.12"},{"os":"macos-latest","python-version":"3.13"}]}') }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history for diff-cover

      # WHY: LFS bandwidth is metered — caching avoids re-downloading 13MB of
      # fixtures on every CI run (~9 LFS checkouts/push was burning 1GB/month).
      - name: Create LFS cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Cache LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - name: Pull LFS files
        run: git lfs pull

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          prune-cache: false
      - run: uv python install ${{ matrix.python-version }}

      - name: Install FFmpeg
        uses: ./.github/actions/install-ffmpeg

      - run: make dev-test

      - name: Run tests with coverage
        run: make test-cov-xml

      # WHY: diff-cover merges tests/*-coverage.xml, but those are gitignored and
      # so can never arrive from a contributor's machine. Code only reachable
      # through FFmpeg would therefore always read as uncovered. This job already
      # installs FFmpeg, so the suites covering the changed paths run here -- and
      # only those: an unrelated PR runs none of them.
      - name: Integration coverage for changed paths
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-24.04' && github.event_name == 'pull_request'
        run: make dev-test-integration integration-coverage-for-diff

      - name: Diff coverage (≥80% on changed lines)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-24.04' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make diff-cover-ci

          # Post diff-cover report as PR comment
          COVERAGE_FILES="coverage.xml"
          for f in tests/*-coverage.xml; do
            [ -f "$f" ] && COVERAGE_FILES="$COVERAGE_FILES $f"
          done
          uvx diff-cover $COVERAGE_FILES --compare-branch=origin/main --format markdown:diff-cover-report.md || true
          if [ -s diff-cover-report.md ]; then
            # GitHub caps a comment body at 65,536 characters; a wide PR's per-file
            # report exceeds it, so keep the summary lines and cut the middle.
            {
              echo "## Diff Coverage Report"
              echo ""
              if [ "$(wc -c < diff-cover-report.md)" -gt 60000 ]; then
                head -c 50000 diff-cover-report.md
                echo ""
                echo ""
                echo "_… report truncated; full output is in the job log …_"
                echo ""
                tail -n 8 diff-cover-report.md
              else
                cat diff-cover-report.md
              fi
            } > diff-cover-comment.md
            # --edit-last updates existing comment instead of spamming new ones.
            # The gate already passed above; a failed comment must not fail the job.
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body-file diff-cover-comment.md --edit-last \
              || gh pr comment "${{ github.event.pull_request.number }}" \
              --body-file diff-cover-comment.md \
              || echo "::warning::could not post the diff-cover comment"
          else
            echo "diff-cover-report.md is empty, skipping PR comment"
          fi

      - name: Upload unit test coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-24.04'
        with:
          files: coverage.xml
          flags: unittests
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Integration coverage is uploaded by the GPU runner (integration.yml)
      # which runs real FFmpeg with hardware encoding on a self-hosted runner.

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        if: ${{ !cancelled() && matrix.python-version == '3.12' && matrix.os == 'ubuntu-24.04' }}
        with:
          files: junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          fail_ci_if_error: false

  test-extras:
    name: Test Extras (${{ matrix.os }})
    if: github.repository_id == '1174219883' && needs.changes.outputs.docs_only != 'true'
    needs: [changes, quality, security]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only the extras with tests marked `extras` (the torch family);
          # everything else runs in the main `test` job.
          - os: ubuntu-24.04
            extras: "dev"
          - os: macos-latest
            extras: "dev,mac"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create LFS cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Cache LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - name: Pull LFS files
        run: git lfs pull
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          prune-cache: false
          cache-suffix: extras
      - run: uv python install "3.13"

      - name: Install FFmpeg
        uses: ./.github/actions/install-ffmpeg

      - name: Install with extras
        run: |
          IFS=',' read -ra EXTRAS <<< "${{ matrix.extras }}"
          ARGS=""
          for extra in "${EXTRAS[@]}"; do
            ARGS="$ARGS --extra $extra"
          done
          uv sync $ARGS

      - run: make test-extras

  # The store suite on PostgreSQL as well as SQLite (#871). Only tests/store/: the
  # repositories are what has to behave the same on both backends.
  test-store:
    name: Test Store (SQLite + PostgreSQL)
    if: github.repository_id == '1174219883' && needs.changes.outputs.store == 'true'
    needs: [changes, quality, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: docker.io/library/postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_PASSWORD: store-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          prune-cache: false
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: make dev-ci
      # The backup drill runs pg_dump/pg_restore against the postgres:16 service above: install
      # exactly that major from PGDG instead of trusting whatever the runner image ships.
      - name: PostgreSQL 16 client
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: The client is 16
        run: |
          pg_dump --version
          pg_dump --version | grep -Eq ' 16\.' || { echo "pg_dump is not 16"; exit 1; }
          pg_restore --version | grep -Eq ' 16\.' || { echo "pg_restore is not 16"; exit 1; }
      - run: make test-store
        env:
          IMMICH_MEMORIES_TEST_DATABASE_URL: postgresql://postgres:store-test@127.0.0.1:5432/postgres

  # Integration tests run LOCALLY via pre-commit hook (not in CI — too slow).
  # Triggered by changes to src/immich_memories/(processing|titles)/ or tests/integration/.
  # Run manually: make test-integration

  # ── Tier 3: Build + Docker (most expensive, after tests) ─────────────────
  build:
    name: Build Package
    if: github.repository_id == '1174219883' && needs.changes.outputs.docs_only != 'true'
    needs: [changes, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv python install ${{ env.PYTHON_VERSION }}
      # The wheel carries the built web client, which is not committed (#1580).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make build
      - name: Check package
        run: make build-check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-ci
          path: dist/

  docker:
    name: Docker (${{ matrix.platform }})
    needs: [changes, test]
    runs-on: ${{ matrix.runner }}
    if: github.repository_id == '1174219883' && github.event_name == 'pull_request' && needs.changes.outputs.container == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=0+g${{ github.sha }}
            INSTALL_EXTRAS=all
            VCS_REF=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          # No gha layer cache: the Dockerfile copies src/ and takes APP_VERSION
          # before every heavy RUN, so no commit reuses a layer (0 CACHED steps
          # measured, #1272), while exporting cost ~140 s per job and ~3 GB of
          # the repo's 10 GB Actions cache per PR, evicting caches that do hit.

  # The image the docker job only builds, run: rebuilt here with the editorial
  # extra (the docker job's `all` build is several GB and never leaves its
  # runner), started from docker-compose.yml on a volume a pre-store install
  # left, then `store backup`/`restore` inside it and the trigger API called as
  # the Kubernetes CronJob calls it. The postgresql leg switches on the compose
  # file's own PostgreSQL example, so that example is what gets tested. Runs when
  # the image, its deployment or the store it backs up changes.
  container-e2e:
    name: Container E2E (${{ matrix.database }})
    needs: [changes, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: >-
      github.repository_id == '1174219883'
      && github.event_name == 'pull_request'
      && (needs.changes.outputs.container == 'true' || needs.changes.outputs.store == 'true')
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          prune-cache: false
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: make dev-ci
      - name: Build the image
        run: make test-container-image
      - name: Container E2E (${{ matrix.database }})
        run: make test-container CONTAINER_E2E_DATABASE=${{ matrix.database }} CONTAINER_E2E_BUILD=0
      - name: Upload container diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-e2e-${{ matrix.database }}
          if-no-files-found: ignore
          path: tests/container-*-junit.xml

  docs:
    name: Docs Build
    env:
      # Exercise configured analytics without using the production collector.
      DOCS_ANALYTICS_DOMAIN: docs.example.com
      DOCS_ANALYTICS_ENDPOINT: https://metrics.example.com/api/event
    if: github.repository_id == '1174219883' && needs.changes.outputs.docs_site == 'true'
    needs: [changes]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create LFS cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Cache LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - name: Pull LFS files
        run: git lfs pull
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: cd docs-site && npm ci
      - run: make docs-check

  # The same launch check with the app's store on each backend; the PostgreSQL
  # leg runs when the store changes. One job, not a smoke/pages split: the page
  # tests reuse what the render leaves in the session, and alone they took as
  # long as the whole suite. `ci-success` fails when either leg fails.
  launch-check:
    name: Hermetic Launch Check (${{ matrix.database }})
    needs: [changes, setup]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Pull requests, and the release (it calls this workflow from a manual dispatch).
    if: >-
      github.repository_id == '1174219883'
      && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        database: ${{ fromJSON(needs.changes.outputs.store == 'true' && '["sqlite","postgresql"]' || '["sqlite"]') }}
    # Started on both legs (services cannot follow the matrix); only the
    # postgresql leg is given its URL. Pinned like the test-store job's.
    services:
      postgres:
        image: docker.io/library/postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_PASSWORD: store-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create LFS cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Cache LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - name: Pull LFS files
        run: git lfs pull
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          prune-cache: false
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            docs-site/package-lock.json
            web/package-lock.json
      - name: Install FFmpeg
        uses: ./.github/actions/install-ffmpeg
      - name: Install project and browser dependencies
        run: |
          make dev-test
          make web-client
          uv run playwright install --with-deps chromium
          cd docs-site && npm ci
      - name: Run launch readiness gate (SQLite)
        if: matrix.database == 'sqlite'
        run: make launch-check-ci
      - name: Run launch readiness gate (PostgreSQL)
        if: matrix.database == 'postgresql'
        run: make launch-check-ci-postgres
        env:
          IMMICH_MEMORIES_E2E_DATABASE_URL: postgresql://postgres:store-test@127.0.0.1:5432/postgres
      - name: Upload launch diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launch-check-diagnostics-${{ matrix.database }}
          if-no-files-found: ignore
          path: |
            tests/e2e-junit.xml
            /tmp/pytest-of-runner/**/server.log
            /tmp/pytest-of-runner/**/output-probe.json
            /tmp/pytest-of-runner/**/launch-smoke*/output/**

  # ── Summary gate ──────────────────────────────────────────────────────────
  # The one check branch protection requires. A job the change scope skipped
  # reports "skipped"; one skipped because a job it needs failed is caught by
  # that job's own result. "cancelled" fails: a job past its timeout-minutes
  # ends cancelled, and a superseded run's verdict no longer counts anyway.
  ci-success:
    name: CI Success
    needs: [changes, setup, quality, security, test, test-extras, test-store, build, docker, container-e2e, docs, launch-check]
    runs-on: ubuntu-24.04
    if: always() && github.repository_id == '1174219883'
    steps:
      - name: Check all jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          for job in changes setup; do
            result=$(jq -r --arg job "$job" '.[$job].result' <<< "$RESULTS")
            [[ "$result" == "success" ]] || { echo "$job did not succeed: $result"; exit 1; }
          done
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "$RESULTS")
          if [[ -n "$failed" ]]; then
            echo "$failed"
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          echo "All jobs passed!"
