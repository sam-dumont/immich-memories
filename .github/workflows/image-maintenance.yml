name: Image Maintenance

on:
  schedule:
    - cron: '23 4 * * 1'
    # Daily: drop nightly image versions whose dated tags passed 14 days.
    - cron: '47 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'docker/**'
      - 'services/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - 'scripts/image*'
      - 'scripts/pip_audit_smart.py'
      - '.github/workflows/image-maintenance.yml'

permissions:
  contents: read

concurrency:
  # The daily prune must not cancel a weekly inventory still running.
  group: image-maintenance-${{ github.ref }}-${{ github.event.schedule }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  inventory:
    if: github.repository_id == '1174219883' && github.event.schedule != '47 5 * * *'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, kind: app, arch: amd64, file: docker/Dockerfile, device: cpu}
          - {runner: ubuntu-24.04-arm, kind: app, arch: arm64, file: docker/Dockerfile, device: cpu}
          - {runner: ubuntu-24.04, kind: inference, arch: amd64, file: docker/Dockerfile.inference, device: cpu}
          - {runner: ubuntu-24.04-arm, kind: inference, arch: arm64, file: docker/Dockerfile.inference, device: cpu}
          - {runner: ubuntu-24.04, kind: inference, arch: amd64, file: docker/Dockerfile.inference, device: cuda}
    env:
      IMAGE_AUDIT_FILE: ${{ matrix.file }}
      IMAGE_AUDIT_DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: make image-audit-build
      - run: make image-audit
      - name: Save exact installed package inventories and audit result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-audit-${{ matrix.kind }}-${{ matrix.device }}-${{ matrix.arch }}
          path: image-audit/
          if-no-files-found: warn
          retention-days: 30

  # Only `nightly-YYYYMMDD` versions go: never `nightly` itself, a release
  # version, `latest`, a commit build, or an untagged platform child.
  prune-nightly:
    name: Prune expired nightly images
    if: github.repository_id == '1174219883' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Delete nightly versions older than 14 days
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for package in immich-memories immich-memories%2Finference; do
            versions="/users/$OWNER/packages/container/$package/versions"
            gh api --paginate --slurp "$versions?per_page=100" \
              | python3 scripts/prune_nightly_images.py \
              | while read -r id; do
                  echo "Deleting $package version $id"
                  gh api --method DELETE "$versions/$id" </dev/null
                done
          done
