name: Image Maintenance

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'docker/**'
      - 'services/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - 'scripts/image*'
      - 'scripts/pip_audit_smart.py'
      - '.github/workflows/image-maintenance.yml'

permissions:
  contents: read

concurrency:
  group: image-maintenance-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  inventory:
    if: github.repository == 'sam-dumont/immich-video-memory-generator'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, kind: app, arch: amd64, file: docker/Dockerfile, device: cpu}
          - {runner: ubuntu-24.04-arm, kind: app, arch: arm64, file: docker/Dockerfile, device: cpu}
          - {runner: ubuntu-latest, kind: inference, arch: amd64, file: docker/Dockerfile.inference, device: cpu}
          - {runner: ubuntu-24.04-arm, kind: inference, arch: arm64, file: docker/Dockerfile.inference, device: cpu}
          - {runner: ubuntu-latest, kind: inference, arch: amd64, file: docker/Dockerfile.inference, device: cuda}
    env:
      IMAGE_AUDIT_FILE: ${{ matrix.file }}
      IMAGE_AUDIT_DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: make image-audit-build
      - run: make image-audit
      - name: Save exact installed package inventories and audit result
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: image-audit-${{ matrix.kind }}-${{ matrix.device }}-${{ matrix.arch }}
          path: image-audit/
          if-no-files-found: warn
          retention-days: 30
