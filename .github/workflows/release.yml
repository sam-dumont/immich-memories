name: Release

on:
  # A merge prepares the next release; the owner chooses when to publish it.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual release)'
        required: false
        default: false
        type: boolean
      channel:
        description: 'stable = final; rc = release candidate (a nightly on demand is the pre-tag rehearsal)'
        required: false
        default: stable
        type: choice
        options:
          - stable
          - rc
      force_version:
        description: 'Force version bump type (optional; starts a new series, ignored while one is open)'
        required: false
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      app_only:
        description: 'Build and push only the main/render app image, tagged by commit'
        required: false
        default: false
        type: boolean
      inference_only:
        description: 'Build and push only the inference images, tagged by commit'
        required: false
        default: false
        type: boolean
  # The nightly (nightly.yml) runs this same process with channel `nightly`, after its
  # own check that main moved. A dispatch offers stable and rc only: a nightly started
  # here would skip that check and the marker its rolling prerelease carries.
  workflow_call:
    inputs:
      dry_run:
        required: false
        default: false
        type: boolean
      channel:
        description: 'stable, rc or nightly'
        required: false
        default: stable
        type: string
      force_version:
        required: false
        default: auto
        type: string
      app_only:
        required: false
        default: false
        type: boolean
      inference_only:
        required: false
        default: false
        type: boolean
      nightly_version:
        description: 'The dev version a nightly stamps on the wheel and images (scripts/nightly.py)'
        required: false
        default: ''
        type: string
      nightly_tag:
        description: 'The dated image tag a nightly pins, nightly-YYYYMMDD'
        required: false
        default: ''
        type: string
      rebuild_inference:
        description: 'A nightly rebuilds the inference images only when their inputs changed'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Version calculation and publication must not overlap another release. A nightly has
# its own group, as before it ran through this workflow: a release never waits for it.
concurrency:
  group: ${{ inputs.channel == 'nightly' && 'nightly-release-process' || 'release-publication' }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Determine if a release is needed based on commits AND branch names
  analyze:
    name: Analyze Commits & Branches
    runs-on: ubuntu-24.04
    if: >-
      github.repository_id == '1174219883' &&
      (github.ref == 'refs/heads/main' || inputs.dry_run || inputs.inference_only || inputs.app_only)
    outputs:
      should_release: ${{ steps.analyze.outputs.should_release || steps.nightly.outputs.should_release }}
      next_version: ${{ steps.analyze.outputs.next_version || steps.nightly.outputs.next_version }}
      release_type: ${{ steps.analyze.outputs.release_type || steps.nightly.outputs.release_type }}
      prerelease: ${{ steps.analyze.outputs.prerelease || steps.nightly.outputs.prerelease }}
      previous_tag: ${{ steps.analyze.outputs.previous_tag || steps.nightly.outputs.previous_tag }}
      # The tag the images and the setup files pin: the version, or a nightly's dated tag.
      image_tag: ${{ steps.nightly.outputs.image_tag || steps.analyze.outputs.next_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # A nightly has no version series to continue: nightly.yml already named its dev
      # version and dated tag. It never opens a release, so nothing here is a tag.
      - name: Name the nightly
        id: nightly
        if: inputs.channel == 'nightly'
        env:
          NIGHTLY_VERSION: ${{ inputs.nightly_version }}
          NIGHTLY_TAG: ${{ inputs.nightly_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          APP_ONLY: ${{ inputs.app_only }}
          INFERENCE_ONLY: ${{ inputs.inference_only }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ] || [ "$APP_ONLY" = "true" ] || [ "$INFERENCE_ONLY" = "true" ]; then
            echo "::error::A nightly is a whole build; dry_run, app_only and inference_only are release modes."
            exit 1
          fi
          [[ "$NIGHTLY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?\.dev[0-9]{8}$ ]] \
            || { echo "::error::Not a nightly version: $NIGHTLY_VERSION"; exit 1; }
          [[ "$NIGHTLY_TAG" =~ ^nightly-[0-9]{8}$ ]] \
            || { echo "::error::Not a nightly tag: $NIGHTLY_TAG"; exit 1; }
          {
            echo "should_release=true"
            echo "next_version=$NIGHTLY_VERSION"
            echo "release_type=nightly"
            echo "prerelease=true"
            echo "previous_tag="
            echo "image_tag=$NIGHTLY_TAG"
          } >> "$GITHUB_OUTPUT"

      # The files people copy from main (README, Compose, example.env, Unraid, Kubernetes,
      # Terraform) pin the last release. The first commit after a release moves them
      # (pre-commit hook `pin-latest-release`); a new release waits until that happened,
      # so main never falls more than one release behind.
      - name: Check main pins the latest release
        if: inputs.channel != 'nightly' && !inputs.app_only && !inputs.inference_only
        run: python3 scripts/release_pin.py --check

      - name: Analyze commits and merged branches
        id: analyze
        if: inputs.channel != 'nightly'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_VERSION: ${{ inputs.force_version }}
          CHANNEL: ${{ inputs.channel }}
          INFERENCE_ONLY: ${{ inputs.inference_only }}
          APP_ONLY: ${{ inputs.app_only }}
        run: |
          image_args=()
          if [[ "$INFERENCE_ONLY" == "true" ]]; then image_args+=(--inference-only); fi
          if [[ "${APP_ONLY:-false}" == "true" ]]; then image_args+=(--app-only); fi
          python3 scripts/release_analyze.py --force-version "${FORCE_VERSION:-auto}" \
            --channel "${CHANNEL:-stable}" "${image_args[@]}" >> "$GITHUB_OUTPUT"

  # Every release runs every gate and every suite first, a nightly included: CI in
  # full (a called workflow is never scoped) and the real-Immich gate.
  ci:
    name: CI
    needs: [analyze]
    if: >-
      github.repository_id == '1174219883' &&
      (inputs.app_only || needs.analyze.outputs.should_release == 'true')
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write

  immich-gate:
    name: Immich Gate
    needs: [analyze]
    if: >-
      github.repository_id == '1174219883' &&
      (inputs.app_only || needs.analyze.outputs.should_release == 'true')
    uses: ./.github/workflows/immich-gate.yml
    permissions:
      contents: read

  # Everything that can fail before anything public happens: build the wheel, attest
  # it, write the notes. The tag, the GitHub Release and PyPI cannot be taken back,
  # so they wait for every job that could still fail (see `release`).
  package:
    name: Build Package
    needs: [analyze, ci, immich-gate]
    if: >-
      github.repository_id == '1174219883' &&
      !cancelled() && needs.analyze.result == 'success' &&
      needs.analyze.outputs.should_release == 'true' &&
      (needs.ci.result == 'success' && needs.immich-gate.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Provenance: the OIDC token is what identifies this workflow to
      # Sigstore, and attestations is where the signed statement is filed.
      id-token: write
      attestations: write

    steps:
      - name: Audit publication egress
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev

      # The wheel carries the built web client, which is not committed (#1580).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web client
        run: |
          make web-client
          uv run python scripts/check_web_brand.py --require-bundle

      - name: Build package
        env:
          # The tag is not pushed until this succeeds; pin the candidate version.
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.analyze.outputs.next_version }}
        run: uv build

      - name: Show built version
        run: |
          echo "Built packages:"
          ls -la dist/
          unzip -p dist/*.whl '*/METADATA' | grep '^Version:'

      - name: Attest build provenance
        id: attest
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Stage the attestation as release assets
        if: ${{ !inputs.dry_run }}
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          NEXT_VERSION: ${{ needs.analyze.outputs.next_version }}
        run: |
          set -euo pipefail
          # WHY not dist/: the pypi-publish job hands the whole directory to
          # twine, which rejects anything that is not a wheel or an sdist.
          mkdir -p attestations
          base="attestations/immich_memories-${NEXT_VERSION}"

          # The Sigstore bundle is what `gh attestation verify --bundle` reads.
          cp "$BUNDLE" "${base}.sigstore.json"

          # The same statement as a bare DSSE envelope. SLSA consumers -- and
          # OpenSSF Scorecard's provenance probe, which matches on the name
          # alone -- expect provenance under .intoto.jsonl. -e fails the step
          # if the bundle ever stops carrying an envelope.
          jq -ce '.dsseEnvelope' "$BUNDLE" > "${base}.intoto.jsonl"

          ls -la attestations/

      - name: Generate changelog
        id: changelog
        if: inputs.channel != 'nightly'
        env:
          NEXT_VERSION: ${{ needs.analyze.outputs.next_version }}
          # A candidate's notes cover what changed since the previous candidate;
          # a final's cover the whole series since the previous final.
          PREV_TAG: ${{ needs.analyze.outputs.previous_tag }}
        run: |

          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md

          if [ -n "$PREV_TAG" ]; then
            # Group commits by type
            echo "### Features" >> release_notes.md
            git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --grep="^feat" >> release_notes.md || true
            echo "" >> release_notes.md

            echo "### Bug Fixes" >> release_notes.md
            git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --grep="^fix" >> release_notes.md || true
            echo "" >> release_notes.md

            echo "### Other Changes" >> release_notes.md
            git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --grep="^feat" --grep="^fix" --invert-grep >> release_notes.md || true

            echo "" >> release_notes.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...v$NEXT_VERSION" >> release_notes.md
          else
            # First release - list all commits
            echo "### Initial Release" >> release_notes.md
            git log --pretty=format:"- %s (%h)" >> release_notes.md || true
            echo "" >> release_notes.md
          fi

      # A nightly's notes name what it was built from. Their `Commit:` line is the
      # marker the next nightly compares main against (scripts/nightly.py).
      - name: Write the nightly notes
        if: inputs.channel == 'nightly'
        env:
          NEXT_VERSION: ${{ needs.analyze.outputs.next_version }}
          IMAGE_TAG: ${{ needs.analyze.outputs.image_tag }}
        run: python3 scripts/nightly.py notes "$NEXT_VERSION" "$GITHUB_SHA" "$IMAGE_TAG" > release_notes.md

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-release
          path: dist/

      - name: Upload release notes and attestations
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            release_notes.md
            attestations/*.sigstore.json
            attestations/*.intoto.jsonl
          if-no-files-found: error

      - name: Dry run summary
        if: inputs.dry_run
        run: |
          echo "## Dry Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Would release version: **v${{ needs.analyze.outputs.next_version }}**" >> $GITHUB_STEP_SUMMARY
          echo "Release type: **${{ needs.analyze.outputs.release_type }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Built packages:" >> $GITHUB_STEP_SUMMARY
          ls -la dist/ >> $GITHUB_STEP_SUMMARY

  # The point of no return. The tag, the GitHub Release and PyPI cannot be taken back,
  # so this runs only once nothing that can fail is left: the wheel is built, the
  # images are smoke-tested and tagged in the registry (overwritable), and the
  # deployment bundle is packaged.
  release:
    name: Create Release
    needs: [analyze, ci, immich-gate, package, docker-manifest, inference-manifest, deployment-bundle]
    if: >-
      github.repository_id == '1174219883' &&
      !cancelled() && !inputs.dry_run && needs.analyze.outputs.should_release == 'true' &&
      (needs.ci.result == 'success' && needs.immich-gate.result == 'success') &&
      needs.package.result == 'success' &&
      needs.docker-manifest.result == 'success' &&
      needs.inference-manifest.result == 'success' &&
      needs.deployment-bundle.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Audit publication egress
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download the built package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-release
          path: dist/

      - name: Download release notes and attestations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: .

      - name: Download deployment files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deployment-assets
          path: deployment-assets/

      # The tag goes out only after every fallible pre-publication step has
      # succeeded (#1010): a stranded tag must stay a resume signal, not the
      # only evidence that a release completed.
      - name: Push release tag
        if: inputs.channel != 'nightly'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ needs.analyze.outputs.next_version }}
        run: |
          if git rev-parse "v$NEXT_VERSION" >/dev/null 2>&1; then
            # Resuming an interrupted release finds the tag already in place;
            # that is expected and idempotent. A tag that already has a GitHub
            # Release is a genuine double-publication and stays an error.
            if gh release view "v$NEXT_VERSION" --json tagName >/dev/null 2>&1; then
              echo "::error::Tag v$NEXT_VERSION already exists and is published!"
              echo "Existing tags:"
              git tag --list 'v*' --sort=-version:refname | head -5
              exit 1
            fi
            echo "Tag v$NEXT_VERSION already exists with no release; resuming the interrupted publication"
            # A stranded tag is a resume signal only for the commit it was pushed for.
            # A retry that built a newer main must not publish newer code under the
            # older tag: re-run the workflow from the tag's commit to resume it.
            tagged=$(git rev-parse "v$NEXT_VERSION^{}")
            built=$(git rev-parse HEAD)
            if [ "$tagged" != "$built" ]; then
              echo "::error::Tag v$NEXT_VERSION points at ${tagged} but this build is ${built}."
              echo "Re-run the workflow from ${tagged} to finish that release under its tag."
              exit 1
            fi
          else
            git tag -a "v$NEXT_VERSION" -m "Release v$NEXT_VERSION"
            git push origin "v$NEXT_VERSION"
          fi

      - name: Create GitHub Release
        if: inputs.channel != 'nightly'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          tag_name: v${{ needs.analyze.outputs.next_version }}
          name: Release v${{ needs.analyze.outputs.next_version }}
          body_path: release_notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            attestations/*.sigstore.json
            attestations/*.intoto.jsonl
            deployment-assets/*
          draft: false
          prerelease: ${{ needs.analyze.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.analyze.outputs.prerelease == 'true' && 'false' || 'true' }}

      # The only tag a nightly moves; version tags are the stable and rc channels'.
      - name: Move the nightly tag to this commit
        if: inputs.channel == 'nightly'
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly

      # One rolling prerelease, never Latest. Deleting first drops last night's files;
      # the tag stays where it was just moved. gh uploads the files before it publishes,
      # so the `Commit:` marker in the notes goes public last.
      - name: Replace the nightly prerelease
        if: inputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ needs.analyze.outputs.next_version }}
        run: |
          set -euo pipefail
          gh release delete nightly --yes || true
          gh release create nightly \
            dist/*.whl dist/*.tar.gz \
            attestations/*.sigstore.json attestations/*.intoto.jsonl \
            deployment-assets/* \
            --verify-tag --prerelease --latest=false \
            --title "Nightly $NEXT_VERSION" --notes-file release_notes.md

      - name: Summary
        env:
          NEXT_VERSION: ${{ needs.analyze.outputs.next_version }}
        run: |
          echo "## Release v$NEXT_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published packages:" >> $GITHUB_STEP_SUMMARY
          ls -la dist/ >> $GITHUB_STEP_SUMMARY

  # Publish to PyPI using Trusted Publishers (OIDC — no API tokens needed)
  pypi-publish:
    name: Publish to PyPI
    needs: [analyze, release, pypi-publish-music]
    # A nightly never reaches a package index.
    if: >-
      github.repository_id == '1174219883' && inputs.channel != 'nightly' &&
      (!inputs.dry_run && needs.analyze.outputs.should_release == 'true')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/immich-memories/
    permissions:
      id-token: write  # Required for OIDC trusted publishing

    steps:
      - name: Audit runner egress
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-release
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1.14

  # The bundled-music package is versioned by hand and rarely changes, so
  # skip-existing makes a release that does not bump it a no-op rather than a
  # failure. It publishes before the main wheel so that, once `all` requires it
  # again, the dependency is on the index before anything can ask for it.
  # PyPI cannot be taken back (a version can never be uploaded twice), so it runs
  # after `release`, which itself waits for every image and the deployment bundle.
  pypi-publish-music:
    name: Publish bundled music to PyPI
    needs: [analyze, release]
    if: >-
      github.repository_id == '1174219883' && inputs.channel != 'nightly' &&
      (!inputs.dry_run && needs.analyze.outputs.should_release == 'true')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/immich-memories-music/
    permissions:
      id-token: write  # Required for OIDC trusted publishing

    steps:
      - name: Audit runner egress
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build the bundled-music distribution
        run: uv build --out-dir dist-music packages/immich-memories-music

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1.14
        with:
          packages-dir: dist-music
          skip-existing: true

  # Deploy docs after release (GITHUB_TOKEN events don't trigger other workflows,
  # so we call the docs workflow directly instead of relying on release:published).
  # It rebuilds every track (stable, next, dev) from the published state; this
  # release lands at the root or under /next as scripts/docs_release.py decides.
  deploy-docs:
    name: Deploy Docs
    needs: [analyze, release, deployment-bundle, pypi-publish]
    if: >-
      github.repository_id == '1174219883' &&
      !cancelled() && !inputs.dry_run && needs.analyze.outputs.should_release == 'true' &&
      needs.release.result == 'success' &&
      needs.deployment-bundle.result == 'success' &&
      (needs.pypi-publish.result == 'success' ||
       (inputs.channel == 'nightly' && needs.pypi-publish.result == 'skipped'))
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  # Build and push Docker images using native runners per platform
  # App and inference packages share the immich-memories registry namespace.
  docker-build:
    name: Build Docker Image (${{ matrix.platform }})
    needs: [analyze, ci, immich-gate]
    if: >-
      github.repository_id == '1174219883' &&
      !cancelled() && needs.analyze.result == 'success' &&
      (needs.ci.result == 'success' && needs.immich-gate.result == 'success') &&
      (!inputs.dry_run && (inputs.app_only || needs.analyze.outputs.should_release == 'true'))
    runs-on: ${{ matrix.runner }}
    # Keep the existing approval before the first registry write. A nightly has none:
    # nobody is awake to give it, and an empty name means no environment.
    environment:
      name: ${{ inputs.channel != 'nightly' && (needs.analyze.outputs.release_type == 'major' && 'production-major' || 'production') || '' }}
    permissions:
      contents: read
      packages: write
      # Same provenance pair as the release job, for the image digest.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            slug: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            slug: arm64

    steps:
      - name: Audit publication egress
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build, push by digest and attest
        uses: ./.github/actions/push-image-digest
        with:
          image: ghcr.io/sam-dumont/immich-memories
          file: ./docker/Dockerfile
          platform: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ needs.analyze.outputs.next_version }}
            INSTALL_EXTRAS=all
            VCS_REF=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          artifact: digests-${{ matrix.slug }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  # WHY this gate (#346): both 2026-08-18 launch blockers (OpenCV 5 resolving
  # into the image, NVENC selected on GPU-less hosts) were image-only problems
  # the unit suite and native E2E cannot see. One CPU-only generation inside
  # the exact amd64 image, against the hermetic fake Immich, gates the tags.
  inference-build:
    name: Build Inference Image (${{ matrix.device }}, ${{ matrix.platform }})
    # After docker-build so the approval on the app image still guards the first
    # registry write; the digests pushed here carry no tag until the manifests.
    needs: [analyze, ci, immich-gate, docker-build]
    # Also runs on a manual dispatch with no release, so a cuda image can be put
    # in front of a real GPU before anyone cuts a version. The tag is then the
    # commit rather than a version, so a test build can never shadow a release.
    if: >-
      github.repository_id == '1174219883' &&
      !cancelled() && needs.analyze.result == 'success' && !inputs.dry_run &&
      (inputs.inference_only ||
       ((needs.ci.result == 'success' && needs.immich-gate.result == 'success') &&
        needs.docker-build.result == 'success' &&
        needs.analyze.outputs.should_release == 'true' &&
        (inputs.channel != 'nightly' || inputs.rebuild_inference)))
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # cpu ships on both architectures a NAS or a laptop might be; cuda is
        # amd64 only, because the CUDA runtime base this builds on is.
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            device: cpu
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            device: cpu
          - runner: ubuntu-24.04
            platform: linux/amd64
            device: cuda

    steps:
      - name: Audit publication egress
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build, push by digest and attest
        uses: ./.github/actions/push-image-digest
        with:
          image: ghcr.io/sam-dumont/immich-memories/inference
          file: ./docker/Dockerfile.inference
          platform: ${{ matrix.platform }}
          build-args: |
            DEVICE=${{ matrix.device }}
            APP_VERSION=${{ needs.analyze.outputs.next_version }}
            VCS_REF=${{ github.sha }}
          artifact: inference-digests-${{ matrix.device }}-${{ strategy.job-index }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  inference-manifest:
    name: Create Inference Manifest
    # Registry version tags move only once the app image passed its smoke test and
    # the wheel built, so a failure anywhere in phase 1 leaves every tag where it was.
    needs: [analyze, ci, immich-gate, package, docker-smoke, inference-build]
    if: >-
      github.repository_id == '1174219883' &&
      !cancelled() && needs.analyze.result == 'success' &&
      (needs.inference-build.result == 'success' ||
       (inputs.channel == 'nightly' && !inputs.rebuild_inference &&
        needs.inference-build.result == 'skipped')) &&
      (inputs.inference_only ||
       ((needs.ci.result == 'success' && needs.immich-gate.result == 'success') &&
        needs.package.result == 'success' &&
        needs.docker-smoke.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Audit publication egress
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      # A nightly whose inference inputs did not change built no digests.
      - name: Download digests
        if: inputs.channel != 'nightly' || inputs.rebuild_inference
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: inference-digests-*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two manifests, not one: cpu spans both architectures, cuda is a separate
      # tag because a GPU image is a deliberate choice rather than a fallback.
      - name: Create and push manifests
        env:
          IMAGE: ghcr.io/sam-dumont/immich-memories/inference
          VERSION: ${{ needs.analyze.outputs.next_version }}
          INFERENCE_ONLY: ${{ inputs.inference_only }}
          PRERELEASE: ${{ needs.analyze.outputs.prerelease }}
          CHANNEL: ${{ inputs.channel }}
          TAG: ${{ needs.analyze.outputs.image_tag }}
          REBUILT: ${{ inputs.channel != 'nightly' || inputs.rebuild_inference }}
        run: |
          # A dispatch build has no version to claim, so it is tagged by commit
          # and never moves `latest`. Only a final release does that.
          if [ "$INFERENCE_ONLY" = "true" ]; then
            base="sha-${GITHUB_SHA:0:12}"
            cpu_tags="-t $IMAGE:$base"
            cuda_tags="-t $IMAGE:$base-cuda"
          elif [ "${CHANNEL:-stable}" = "nightly" ]; then
            if [ "$REBUILT" != "true" ]; then
              # Unchanged inference inputs: the previous nightly's images also get
              # today's tag, so the Compose files pin one tag for every service.
              docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:nightly"
              docker buildx imagetools create -t "$IMAGE:$TAG-cuda" "$IMAGE:nightly-cuda"
              exit 0
            fi
            # A nightly moves only its rolling tag and today's date tag.
            cpu_tags="-t $IMAGE:nightly -t $IMAGE:$TAG"
            cuda_tags="-t $IMAGE:nightly-cuda -t $IMAGE:$TAG-cuda"
          elif [ "$PRERELEASE" = "true" ]; then
            cpu_tags="-t $IMAGE:$VERSION"
            cuda_tags="-t $IMAGE:$VERSION-cuda"
          else
            cpu_tags="-t $IMAGE:$VERSION -t $IMAGE:latest"
            cuda_tags="-t $IMAGE:$VERSION-cuda -t $IMAGE:latest-cuda"
          fi
          cpu=$(find /tmp/digests -path '*-cpu-*' -type f -exec basename {} \; | sed "s|^|$IMAGE@sha256:|" | tr '\n' ' ')
          cuda=$(find /tmp/digests -path '*-cuda-*' -type f -exec basename {} \; | sed "s|^|$IMAGE@sha256:|" | tr '\n' ' ')
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/cpu-manifest.json" $cpu_tags $cpu
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/cuda-manifest.json" $cuda_tags $cuda

      - name: Read cpu manifest digest
        if: inputs.channel != 'nightly' || inputs.rebuild_inference
        id: cpu-manifest
        run: |
          digest="$(jq -er '.["containerimage.descriptor"].digest | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/cpu-manifest.json")"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Attest cpu manifest provenance
        if: inputs.channel != 'nightly' || inputs.rebuild_inference
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/sam-dumont/immich-memories/inference
          subject-digest: ${{ steps.cpu-manifest.outputs.digest }}
          push-to-registry: true

      - name: Read cuda manifest digest
        if: inputs.channel != 'nightly' || inputs.rebuild_inference
        id: cuda-manifest
        run: |
          digest="$(jq -er '.["containerimage.descriptor"].digest | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/cuda-manifest.json")"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Attest cuda manifest provenance
        if: inputs.channel != 'nightly' || inputs.rebuild_inference
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/sam-dumont/immich-memories/inference
          subject-digest: ${{ steps.cuda-manifest.outputs.digest }}
          push-to-registry: true

  docker-smoke:
    name: Smoke Test Docker Image
    if: >-
      github.repository_id == '1174219883' && !cancelled() &&
      needs.analyze.result == 'success' && needs.docker-build.result == 'success'
    needs: [analyze, docker-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run one CPU-only generation inside the image
        uses: ./.github/actions/smoke-app-image
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  # Merge per-platform images into a multi-arch manifest
  docker-manifest:
    name: Create Docker Manifest
    # A failing CUDA build must not leave an app version tag or `latest` moved, so
    # this waits for every phase-1 job, not just the app smoke test.
    needs: [analyze, ci, immich-gate, package, docker-build, docker-smoke, inference-build]
    if: >-
      github.repository_id == '1174219883' &&
      !cancelled() && needs.docker-smoke.result == 'success' &&
      (inputs.app_only ||
       ((needs.ci.result == 'success' && needs.immich-gate.result == 'success') &&
        needs.package.result == 'success' &&
        (needs.inference-build.result == 'success' ||
         (inputs.channel == 'nightly' && !inputs.rebuild_inference &&
          needs.inference-build.result == 'skipped'))))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Audit publication egress
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/sam-dumont/immich-memories
          VERSION: ${{ needs.analyze.outputs.next_version }}
          PRERELEASE: ${{ needs.analyze.outputs.prerelease }}
          APP_ONLY: ${{ inputs.app_only }}
          CHANNEL: ${{ inputs.channel }}
          TAG: ${{ needs.analyze.outputs.image_tag }}
        run: |
          # Standalone builds and candidates never move the last final's tag.
          latest=(-t "$IMAGE:latest")
          if [ "${APP_ONLY:-false}" = "true" ]; then
            VERSION="sha-${GITHUB_SHA:0:12}"
            latest=()
          elif [ "${CHANNEL:-stable}" = "nightly" ]; then
            # A nightly moves only its rolling tag and today's date tag.
            VERSION="$TAG"
            latest=(-t "$IMAGE:nightly")
          elif [ "$PRERELEASE" = "true" ]; then
            latest=()
          fi
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/app-manifest.json" \
            -t "$IMAGE:$VERSION" \
            "${latest[@]}" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Read app manifest digest
        id: app-manifest
        run: |
          digest="$(jq -er '.["containerimage.descriptor"].digest | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/app-manifest.json")"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Attest app manifest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/sam-dumont/immich-memories
          subject-digest: ${{ steps.app-manifest.outputs.digest }}
          push-to-registry: true

  deployment-bundle:
    name: Package matching deployment manifests
    # Packaged here, attached by `release`: there is no GitHub Release to attach to yet.
    needs: [analyze, package, docker-manifest, inference-manifest]
    if: >-
      github.repository_id == '1174219883' && !cancelled() &&
      needs.analyze.outputs.should_release == 'true' && !inputs.dry_run &&
      needs.package.result == 'success' && needs.docker-manifest.result == 'success' &&
      needs.inference-manifest.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Download the built wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-release
          path: ${{ runner.temp }}/dist-release
      - name: Package deployment files
        env:
          VERSION: ${{ needs.analyze.outputs.image_tag }}
        run: bash scripts/package_release_assets.sh
      # The wheel is in the release already (from dist-release); only the new
      # setup and evidence assets travel.
      - name: Upload deployment files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-assets
          path: |
            ${{ runner.temp }}/immich-memories-compose-${{ needs.analyze.outputs.image_tag }}/*.yml
            ${{ runner.temp }}/immich-memories-compose-${{ needs.analyze.outputs.image_tag }}/example.env
            ${{ runner.temp }}/immich-memories-compose-${{ needs.analyze.outputs.image_tag }}/*.xml
            ${{ runner.temp }}/immich-memories-compose-${{ needs.analyze.outputs.image_tag }}/*.tar.gz
            ${{ runner.temp }}/immich-memories-compose-${{ needs.analyze.outputs.image_tag }}/*.json
            ${{ runner.temp }}/immich-memories-compose-${{ needs.analyze.outputs.image_tag }}/SHA256SUMS
          if-no-files-found: error
