name: Nightly

# A daily build of `main` for people who test it: app and inference images tagged
# `nightly` and `nightly-YYYYMMDD`, the wheel and Compose files on one rolling
# `nightly` prerelease, and the docs for `main` at /dev/. Started by hand with
# `force`, it is also the pre-tag rehearsal of a release.
#
# This file only decides whether tonight has anything to build. The build is
# release.yml with channel `nightly`: the same jobs, in the same order, as a stable
# or rc release. Where a nightly differs (no CI rerun, no approval, nightly tags, no
# PyPI, no version tag, the rolling prerelease), it is an `if:` in release.yml.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even when main has no commits since the last nightly'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nightly-publication
  cancel-in-progress: false

jobs:
  decide:
    name: Anything new on main?
    runs-on: ubuntu-24.04
    if: github.repository_id == '1174219883' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      inference: ${{ steps.plan.outputs.inference }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Compares main with the commit named by the published `nightly` release.
      - name: Compare main with the last nightly
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
        run: python3 scripts/nightly.py plan

  release:
    name: Release process (nightly channel)
    needs: [decide]
    if: github.repository_id == '1174219883' && needs.decide.outputs.build == 'true'
    uses: ./.github/workflows/release.yml
    secrets: inherit
    # The ceiling for every job release.yml runs, including the CI and docs workflows
    # it calls (a called job may not ask for more, even when skipped); each job there
    # still asks for only what it uses.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      pages: write
      pull-requests: write
    with:
      channel: nightly
      nightly_version: ${{ needs.decide.outputs.version }}
      nightly_tag: ${{ needs.decide.outputs.tag }}
      rebuild_inference: ${{ needs.decide.outputs.inference == 'true' }}
