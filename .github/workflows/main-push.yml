name: Main Push

# ci.yml runs on pull_request only, so two PRs that were each green can break
# main together (one removes an import, the other still uses it) and nothing
# notices until the next PR goes red. This is the cheap tripwire: the unit suite
# and the type check on the merged result, on one cell. It is not a PR check and
# nothing requires it; a failure shows as a red mark on the commit.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: Unit suite and type check (main)
    if: github.repository == 'sam-dumont/immich-video-memory-generator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Same LFS cache as ci.yml's Test job; fixtures are metered bandwidth.
      - name: Create LFS cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Cache LFS objects
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - name: Pull LFS files
        run: git lfs pull

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          prune-cache: false
      # 3.12 is the cell ci.yml's Test job uploads coverage from.
      - run: uv python install 3.12

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: make dev-test

      # A collection error (an import the merge removed) fails this step.
      - name: Unit suite
        run: make test

      - name: Type check (mypy)
        if: '!cancelled()'
        run: make typecheck
