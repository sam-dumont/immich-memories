name: OpenSSF Scorecard

on:
  branch_protection_rule:
  # Nightly, not on every push to main: during a merge wave each push queued a
  # run that competed with pull requests for the same runner slots.
  schedule:
    - cron: '25 3 * * *'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    if: github.repository_id == '1174219883'
    permissions:
      # A job-level block replaces the top-level read-all, so every read the
      # action needs has to be spelled out again here.
      security-events: write
      # OIDC token for publish_results (badge + api.scorecard.dev).
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        # v2.4.0 was the last release whose image lived on gcr.io, which now
        # refuses every pull with a billing error. v2.4.1+ ship from ghcr.io.
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
