name: Deploy Docs

# Pages serves one artifact, so every deploy builds every track from its own ref
# (scripts/docs_release.py decides which): stable at the root, the newest newer
# release candidate at /next/, the latest nightly's commit at /dev/.
on:
  release:
    types: [published]
  # Called from the release and nightly workflows (GITHUB_TOKEN events don't trigger others)
  workflow_call:
  # Allow manual deploys
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
  DOCS_ANALYTICS_DOMAIN: ${{ vars.DOCS_ANALYTICS_DOMAIN }}
  DOCS_ANALYTICS_ENDPOINT: ${{ vars.DOCS_ANALYTICS_ENDPOINT }}

concurrency:
  group: docs-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Choose the docs tracks
    runs-on: ubuntu-24.04
    # Model artifact releases (models-v*) are not app releases, and Pages refuses their tags.
    if: >-
      github.repository_id == '1174219883'
      && !(github.event_name == 'release' && startsWith(github.event.release.tag_name, 'models-'))
    permissions:
      contents: read
    outputs:
      tracks: ${{ steps.tracks.outputs.tracks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choose what each track is built from
        id: tracks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          dev_ref=$(python3 scripts/nightly.py last-commit)
          tracks=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | python3 scripts/docs_release.py --tracks --dev-ref "$dev_ref")
          echo "tracks=$tracks" >> "$GITHUB_OUTPUT"
          echo "Docs tracks: $tracks"

      # Versioned docs link to their release's setup files; refuse to publish
      # links while those uploads are pending or missing. Dev docs link none.
      - name: Verify matching setup release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKS: ${{ steps.tracks.outputs.tracks }}
        run: |
          set -euo pipefail
          while read -r version; do
            gh release view "$version" --json tagName,assets </dev/null \
              | python3 scripts/check_docs_release_assets.py "$version"
          done < <(jq -r '.[] | select(.version != "") | .version' <<<"$TRACKS")

  build:
    name: Build ${{ matrix.track }} docs
    needs: [plan]
    if: github.repository_id == '1174219883'
    runs-on: ubuntu-24.04
    # Building only reads the tree.
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tracks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags too: dev docs name their build with `git describe`.
          fetch-depth: 0
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Create LFS cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Cache LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - name: Pull LFS files
        run: git lfs pull

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: cd docs-site && npm ci

      - name: Stamp the release version
        if: matrix.version != ''
        env:
          VERSION: ${{ matrix.version }}
        run: |
          echo "DOCS_VERSION=${VERSION}" >> "$GITHUB_ENV"
          cd docs-site
          export DOCS_VERSION_CLEAN="${VERSION#v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.version = process.env.DOCS_VERSION_CLEAN;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      # Large static media whose bytes match the stable ref's are linked from the
      # stable tree, and the assembly drops this track's copy.
      - name: List media shared with stable
        if: matrix.track != 'stable'
        env:
          STABLE: ${{ matrix.stable }}
        run: |
          python3 scripts/docs_shared_media.py select --stable-ref "$STABLE" > "$RUNNER_TEMP/shared-media.json" \
            || echo '[]' > "$RUNNER_TEMP/shared-media.json"
          echo "DOCS_SHARED_MEDIA_FILE=$RUNNER_TEMP/shared-media.json" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/shared-media.json"

      # DOCS_NEXT is what release tags built before DOCS_TRACK existed read.
      - name: Build site
        env:
          DOCS_TRACK: ${{ matrix.track }}
          DOCS_NEXT: ${{ matrix.track == 'next' }}
        run: |
          make docs-build
          # A ref older than shared media ignores the list: it then links its own copies.
          if [[ -n "${DOCS_SHARED_MEDIA_FILE:-}" ]] && grep -q 'DOCS_SHARED_MEDIA_FILE' docs-site/docusaurus.config.ts; then
            cp "$DOCS_SHARED_MEDIA_FILE" docs-site/build/shared-media.json
          fi

      - name: Upload the ${{ matrix.track }} tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-${{ matrix.track }}
          path: docs-site/build
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble the site
    needs: [plan, build]
    if: github.repository_id == '1174219883'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download every track
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docs-*
          path: ${{ runner.temp }}/tracks

      - name: Place each track at its path
        env:
          TRACKS: ${{ needs.plan.outputs.tracks }}
        # Drops the copies a track shares with stable and prints each track's size.
        # Pages refuses sites over 1 GB; fail here, with headroom, instead.
        run: |
          python3 scripts/docs_shared_media.py assemble --tracks "$TRACKS" \
            --trees "$RUNNER_TEMP/tracks" --site "$RUNNER_TEMP/site" --max-mb 900

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy to GitHub Pages
    if: github.repository_id == '1174219883'
    needs: [assemble]
    runs-on: ubuntu-24.04
    # The deploy-pages contract: pages to publish, id-token to prove which
    # workflow is publishing.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
