name: Deploy Docs

on:
  # Deploy only on releases (not every push to main)
  release:
    types: [published]
  # Called from release pipeline (GITHUB_TOKEN events don't trigger other workflows)
  workflow_call:
    inputs:
      version:
        description: 'Version tag to inject into docs (e.g. v1.2.3)'
        required: false
        type: string
  # Allow manual deploys
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}

concurrency:
  group: docs-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    # Model artifact releases (models-v*) are not app releases, and Pages refuses their tags.
    if: >-
      github.repository_id == '1174219883'
      && !(github.event_name == 'release' && startsWith(github.event.release.tag_name, 'models-'))
    # Building only reads the tree; the Pages artifact upload runs on the
    # Actions runtime token, not GITHUB_TOKEN.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.version || github.event.release.tag_name || github.ref }}
      - name: Create LFS cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Cache LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - name: Pull LFS files
        run: git lfs pull

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: cd docs-site && npm ci

      - name: Inject version from release tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Use workflow_call input, release tag, or git describe
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$EVENT_NAME" == "release" ]]; then
            VERSION="$RELEASE_TAG"
          else
            VERSION=$(node --experimental-strip-types --input-type=module -e "import {resolveDocsVersion} from './docs-site/build-version.ts'; console.log(resolveDocsVersion());")
          fi
          echo "DOCS_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building docs for version: ${VERSION}"

          # Set version in docusaurus config via env var
          # (customFields.version is available in React components)
          # Set version in package.json safely via env var
          cd docs-site
          export DOCS_VERSION_CLEAN="${VERSION#v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.version = process.env.DOCS_VERSION_CLEAN;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Verify matching setup release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Development previews already disable setup exports. Release docs must
          # not publish links while deployment uploads are pending or missing.
          if [[ "$DOCS_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-(rc|dev)\.[0-9]+)?$ ]]; then
            gh release view "v${DOCS_VERSION#v}" --json tagName,assets \
              | python3 scripts/check_docs_release_assets.py "$DOCS_VERSION"
          fi

      - name: Choose documentation destination
        run: |
          FINAL_TAG=$(git tag --list | python3 scripts/docs_release.py "$DOCS_VERSION")
          echo "FINAL_TAG=$FINAL_TAG" >> "$GITHUB_ENV"
          if [[ -n "$FINAL_TAG" ]]; then
            echo "DOCS_NEXT=true" >> "$GITHUB_ENV"
          fi

      - name: Build site
        run: cd docs-site && npm run build

      - name: Preserve final documentation beside the candidate
        if: env.DOCS_NEXT == 'true'
        run: |
          mv docs-site/build "$RUNNER_TEMP/candidate-docs"
          git worktree add --detach "$RUNNER_TEMP/final-docs" "$FINAL_TAG"
          git -C "$RUNNER_TEMP/final-docs" lfs pull
          cd "$RUNNER_TEMP/final-docs/docs-site"
          npm ci
          DOCS_VERSION="$FINAL_TAG" DOCS_NEXT=false npm run build
          cp -a build "$GITHUB_WORKSPACE/docs-site/build"
          mv "$RUNNER_TEMP/candidate-docs" "$GITHUB_WORKSPACE/docs-site/build/next"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/build

  deploy:
    name: Deploy to GitHub Pages
    if: github.repository_id == '1174219883'
    needs: build
    runs-on: ubuntu-latest
    # The deploy-pages contract: pages to publish, id-token to prove which
    # workflow is publishing.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
