# Mirror to private repo → triggers GPU integration tests → status callback
#
# SECURITY: Self-hosted GPU runners can't safely run on public repos (fork abuse).
# This workflow mirrors code to a private repo where ARC GPU runners are scoped.
#
# Triggers:
#   - push to main: automatic (post-merge integration regression check)
#   - workflow_dispatch: manual (test a specific branch before merging)
#
# NEVER add pull_request trigger — any fork could push malicious code
# (crypto miners, exfiltration) to the GPU runner. PRs only get unit tests
# on GitHub-hosted runners.
#
# Flow:
#   1. Push branch to private mirror (a token minted by the CI GitHub App)
#   2. Trigger integration workflow via repository_dispatch
#   3. Post "pending" commit status on this repo
#   4. Private repo runs FFmpeg + GPU tests on ARC K8s runner
#   5. Private repo posts "success"/"failure" status back here
#
# WHY every other job carries `if: github.repository_id == '1174219883'`:
# the force-push below brings every workflow file into the private mirror, and
# private repos bill GitHub-hosted minutes. Unguarded, benchmark/codeql/etc.
# ate 90% of the free 2,000 minutes in a month. Only integration.yml may run
# there. `make workflow-guard` (part of `make lint`) fails on an unguarded job.

name: Mirror to CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to test (defaults to current)"
        required: false
        type: string

# Every write goes through a token the CI GitHub App (immich-memories-ci-bot)
# mints for this run, scoped to one repository: the push, the dispatch and the
# mirror's bot-PR cleanup through one for the mirror (GITHUB_TOKEN cannot see
# it), the pending status through one for this repository with Commit statuses
# write alone. An app token lives one hour instead of a stored token that
# expires, and GITHUB_TOKEN only reads.
permissions:
  contents: read

jobs:
  mirror:
    name: Mirror & Trigger GPU Tests
    runs-on: ubuntu-24.04
    if: github.repository_id == '1174219883'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # WHY: checkout's stored header would go to the mirror too, next to
          # the app token's, and GitHub refuses two Authorization headers.
          # This repository is public, so fetching needs no credential.
          persist-credentials: false
          ref: ${{ inputs.branch || github.sha }}
      - name: Create LFS cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Cache LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - name: Pull LFS files
        run: git lfs pull

      - name: Resolve checked-out target
        id: target
        env:
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          git check-ref-format --branch "$BRANCH" >/dev/null
          printf 'sha=%s\nbranch=%s\n' "$(git rev-parse HEAD)" "$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Mint a mirror token
        id: mirror-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: sam-dumont
          repositories: immich-memories-ci
          # contents + workflows: the force-push carries workflow files.
          # contents also covers the repository_dispatch below.
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write

      - name: Push to private mirror
        env:
          MIRROR_TOKEN: ${{ steps.mirror-token.outputs.token }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          mirror=https://github.com/sam-dumont/immich-memories-ci.git
          git remote add mirror "$mirror"
          # WHY: a header scoped to the mirror's URL keeps the token out of the
          # remote URL (and so out of logs); git-lfs reads the same setting.
          basic=$(printf 'x-access-token:%s' "$MIRROR_TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          git config "http.$mirror/.extraheader" "AUTHORIZATION: basic $basic"
          trap 'git config --unset-all "http.$mirror/.extraheader" || true' EXIT
          # Always push main first (integration.yml must exist on default branch
          # for repository_dispatch to find the workflow)
          git fetch origin main
          git push mirror --force "origin/main:refs/heads/main"
          # Then push the target branch
          git push mirror --force "HEAD:refs/heads/${BRANCH}"
          git push mirror --force --tags 2>/dev/null || true
          # WHY: git push doesn't auto-push LFS to non-origin remotes.
          # Without this, LFS pointers land but blobs are missing = CI fails.
          git lfs push mirror --all 2>/dev/null || true

      - name: Mint a status token
        id: status-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: sam-dumont
          repositories: immich-memories
          permission-statuses: write

      - name: Set pending status
        env:
          GH_TOKEN: ${{ steps.status-token.outputs.token }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" --method POST \
            -f state=pending -f 'context=Integration (GPU)' \
            -f 'description=Waiting for GPU runner...' \
            -f target_url=https://github.com/sam-dumont/immich-memories-ci/actions

      - name: Trigger integration tests
        env:
          GH_TOKEN: ${{ steps.mirror-token.outputs.token }}
          SHA: ${{ steps.target.outputs.sha }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          jq -n --arg sha "$SHA" --arg branch "$BRANCH" --arg repo "$GITHUB_REPOSITORY" \
            '{event_type: "integration-test", client_payload: {sha: $sha, branch: $branch, public_repo: $repo}}' \
            | gh api repos/sam-dumont/immich-memories-ci/dispatches --method POST --input -

      # Dependabot reads the dependabot.yml this push carries and opens on the
      # mirror the same update PRs this repository gets. Merging one there does
      # nothing (the next push overwrites main), so they are closed here.
      - name: Close the mirror's bot PRs
        env:
          GH_TOKEN: ${{ steps.mirror-token.outputs.token }}
        run: |
          for n in $(gh api "repos/sam-dumont/immich-memories-ci/pulls?state=open&per_page=100" \
                       --jq '.[] | select(.user.login == "dependabot[bot]" or .user.login == "renovate[bot]") | .number'); do
            gh pr close "$n" -R sam-dumont/immich-memories-ci \
              -c "CI mirror: main is force-pushed from sam-dumont/immich-memories, where dependency updates land."
          done
