name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the details below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Run `immich-memories generate ...`
        2. ...
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: Report
      description: Paste the output of `immich-memories report` (or Copy report in the web client). Review it before sharing. Attach the ZIP from `--bundle report.zip` if needed.
    validations:
      required: true
