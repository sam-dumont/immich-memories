name: Set up uv and Python
description: >-
  Install uv with its dependency cache kept between runs, install one Python, and
  optionally run the make target that installs the project's tools (`dev-ci`,
  `dev-test`). The calling job checks the repository out first.

inputs:
  python-version:
    description: The Python uv installs (the workflow's PYTHON_VERSION, or a matrix cell)
    required: true
  cache-suffix:
    description: Keeps a job whose dependency set differs in its own uv cache
    required: false
    default: ''
  install:
    description: A make target to run once Python is in place; empty runs none
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        prune-cache: false
        cache-suffix: ${{ inputs.cache-suffix }}

    - name: Install Python
      shell: bash
      env:
        PYTHON: ${{ inputs.python-version }}
      run: uv python install "$PYTHON"

    - name: Install the project's tools
      if: inputs.install != ''
      shell: bash
      env:
        TARGET: ${{ inputs.install }}
      run: make "$TARGET"
