name: Smoke-test the app image
description: >-
  Render one CPU-only film inside the exact amd64 app image just pushed by digest,
  against the hermetic fake Immich. Both early launch blockers were image-only
  problems the unit suite and native E2E could not see. The calling job checks
  out the repository and grants packages read.

inputs:
  registry-token:
    description: Token that can pull from GHCR (the job's GITHUB_TOKEN)
    required: true

runs:
  using: composite
  steps:
    - name: Download digests
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: /tmp/digests
        pattern: digests-amd64
        merge-multiple: true

    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.registry-token }}

    - name: Install ffprobe
      uses: ./.github/actions/install-ffmpeg

    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

    # The same setup as the workflows' other jobs: the smoke serves the repository's fake
    # Immich, which imports the project and its dev dependencies.
    - name: Set up Python
      shell: bash
      run: uv python install "$PYTHON_VERSION"

    - name: Install dependencies
      shell: bash
      run: make dev-test

    - name: Run one CPU-only generation inside the image
      shell: bash
      run: |
        digest="sha256:$(ls /tmp/digests | head -1)"
        image="ghcr.io/sam-dumont/immich-memories@${digest}"
        docker pull "$image"
        make docker-smoke SMOKE_IMAGE="$image"
