name: Set up a launch-check suite
description: >-
  What the hermetic launch check's e2e shards and the feature shards (on the fake and
  on a real Immich) all need: the LFS fixtures, Python with the project installed by a
  make target, FFmpeg and the built web client, cached per change to web/; with
  `browser`, Playwright's Chromium too. The calling job checks the repository out first.

inputs:
  python-version:
    description: The Python uv installs (the workflow's PYTHON_VERSION)
    required: true
  install:
    description: The make target that installs the project (`dev-test`, `dev-test-features`)
    required: true
  browser:
    description: "'true' installs Playwright's Chromium and its system libraries"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Pull LFS files
      uses: ./.github/actions/pull-lfs

    - name: Set up uv and Python
      uses: ./.github/actions/setup-uv-python
      with:
        python-version: ${{ inputs.python-version }}

    # The built client depends on web/ alone (vite.config.ts writes it into the
    # package), so one build per change to web/ serves every job and every run after.
    - name: Restore the built web client
      id: web-client
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: src/immich_memories/web/client
        key: web-client-${{ hashFiles('web/**', '!web/node_modules/**') }}

    - if: steps.web-client.outputs.cache-hit != 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install FFmpeg
      uses: ./.github/actions/install-ffmpeg

    - name: Install the project and build the web client when no build was cached
      shell: bash
      env:
        TARGET: ${{ inputs.install }}
      run: |
        make "$TARGET"
        make web-client-present

    # `--with-deps` runs apt itself, without the retries install-ffmpeg uses, so one
    # stalled Ubuntu mirror failed whole launch-check shards with apt exit 100. The system
    # libraries go first, under apt's own retries and a bounded retry of the whole install;
    # the browser download after them never touches apt.
    - name: Install Chromium's system libraries
      if: inputs.browser == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nDPkg::Lock::Timeout "60";\n' \
          | sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
        for attempt in 1 2 3; do
          # Three bounded attempts stay well inside the launch job's 30-minute timeout.
          if timeout 240 uv run playwright install-deps chromium; then
            exit 0
          fi
          echo "::warning::Chromium's system libraries did not install (attempt $attempt of 3)"
          sleep 15
        done
        exit 1

    - name: Install Chromium
      if: inputs.browser == 'true'
      shell: bash
      run: uv run playwright install chromium
