[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "immich-memories"
dynamic = ["version"]
description = "Watch your memories again, in films you can make your own."
readme = "README.md"
license = "MIT"
# Upper bound matches quadrants (the GPU title renderer, below): it ships no 3.14
# wheel at all, so a 3.14-only host silently got PIL titles with no warning before
# this cap existed (#1987). `uv tool install` resolves a compatible interpreter
# instead; pip refuses outright. Lift the bound once quadrants ships a 3.14 wheel.
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Immich Memories Contributors" }
]
keywords = ["immich", "video", "memories", "compilation", "photo-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
]

dependencies = [
    "httpx>=0.27,<1",  # 1.0 is still a dev line (no stable release); it drops TimeoutException (#2081)
    "pydantic>=2.0",
    "pydantic-settings>=2.16.0",
    "fastapi>=0.150.0",  # the server the web client talks to (#1395)
    "uvicorn>=0.54.0",  # runs it: `immich-memories ui`
    "itsdangerous>=2.2",  # signs the session cookie (Starlette's SessionMiddleware)
    "python-multipart>=0.0.31",  # music uploads: FastAPI reads multipart forms with it
    "opencv-python>=5,<6",  # photo rendering, thumbnail hashing, motion facts; YuNet freed the 4.x pin (#557)
    "pyyaml>=6.0",
    "packaging>=24.0",  # compares the running version with the releases the update check lists
    "click>=8.5.0",
    "rich>=13.0",
    "pillow>=13.0.0",
    # Decode-only build of pillow-heif: no bundled x265 encoder, so no GPL (#1894).
    "pi-heif>=1.4",
    "numpy>=1.24",
    "geopy>=2.5.0",
    "staticmap>=0.5",
    "apprise>=2.0.1,<3",
    # The GPU kernel library the title renderer compiles against (#558). Title
    # rendering is the phase that dominates a run, so it ships by default: the
    # fallback is a visibly poorer title, not a missing feature.
    #
    # Marker: no macOS x86_64 wheel is published. The `python_version < '3.14'`
    # half is now also enforced by `requires-python` above, which keeps this
    # package off 3.14 entirely; it stays here too in case that cap is ever
    # loosened before quadrants ships a 3.14 wheel. On either branch, `ti` is
    # None and title screens are PIL-rendered.
    "quadrants>=1.3.0; python_version < '3.14' and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
    "freetype-py>=2.4",  # SDF font rendering
    "babel>=2.18.0",
    # Each country's public holidays, for the holiday memory and for which days discovery asks
    # whether they were the holiday itself. The country is the home base's.
    "holidays>=0.107",
    # The store (#871): one Alembic history on SQLite (default) or PostgreSQL.
    "sqlalchemy>=2.1.5",
    "alembic>=1.13",
    "psycopg[binary]>=3.3.6",  # PostgreSQL driver, loaded by SQLAlchemy's postgresql+psycopg dialect
    "cryptography>=50.0.2",  # Fernet for secrets the settings layer keeps in the store
    # WordNet through nltk: which words of a request typed as a sentence are things, places or
    # names. The corpus is a model file `models fetch` downloads; nothing fetches it at run time.
    "nltk>=3.9.1",
    # Traces (#656): the SDK and its OTLP/HTTP exporter load only when OTEL_EXPORTER_OTLP_ENDPOINT
    # is set; without it the API's no-op tracer is all that runs.
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    # The hops a run makes, as client and server spans: web routes, HTTP calls, store queries.
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
]

[project.optional-dependencies]
# Bundled royalty-free music, shipped as its own distribution so a plain install
# stays small. Published by the release workflow before the main wheel, so `all`
# can require it.
music = [
    "immich-memories-music>=0.1.0",
]
# Mac-specific: Metal tells the automatic tier that this Mac has a GPU.
mac = [
    "pyobjc-framework-Metal>=9.0; sys_platform == 'darwin'",
]
# OIDC authentication (only needed for SSO login)
auth = [
    "authlib>=1.9.1",
]
# Local Demucs stem separation (in-process, no API server needed)
# Model cache: ~/.cache/torch/hub/ (~80MB for htdemucs)
demucs = [
    "demucs>=4.0",
    "soundfile>=0.14.0",
]
# Local ACE-Step music generation (in-process, no API server needed)
# ⚠️  NOT a pip extra — ACE-Step is not published on PyPI.
#     Install the tested v0.1.8 tag with --no-deps, then its inference-only
#     dependencies. The upstream UI set conflicts with this app's Starlette.
#     See docs-site/docs/make/titles-maps-music.md for setup instructions.
# Required when preparing missing editorial public heads and detector facts.
# Weights and the compact-caption endpoint are separate setup dependencies.
#
# Every seat here is an ONNX graph on ONNX Runtime, so this extra is torch-free
# and resolves with no `nvidia-*` wheel at all. That is what the ONNX detector
# bought: the sensitive-content seat used to be a timm/torch model, which cost
# 920 MB in a CPU image, 11 s of interpreter start-up, and the whole class of
# bug where `torch` and `torchvision` resolve from different indexes (#805,
# #806).
editorial = [
    "onnxruntime>=1.31.0",
    "tokenizers>=0.23.3",
    "huggingface-hub>=1.33.0",
    "kaldi-native-fbank>=1.20",
]
# The same seats on a CUDA host. Split by device rather than by feature, the way
# immich-machine-learning splits its own image: only this variant pulls the CUDA
# wheels, and the CPU one must never contain them.
#
# It REPLACES `editorial`, never joins it: `onnxruntime-gpu` ships the CPU
# provider too, and installing both distributions puts two copies of the same
# import name in one environment. `all` and `all-mac` therefore keep the CPU
# variant, and the marker keeps a Linux-only wheel out of a macOS resolution.
editorial-cuda = [
    # 1.27+ requires CUDA 13; the supported image uses CUDA 12 / cuDNN 9.
    "onnxruntime-gpu>=1.26,<1.27; sys_platform == 'linux'",
    "tokenizers>=0.23.3",
    "huggingface-hub>=1.33.0",
    "kaldi-native-fbank>=1.20",
]

all = [
    "immich-memories[music]",
    "immich-memories[auth]",
    # demucs pulls sphn, which has no manylinux aarch64 wheel; building it there needs
    # Rust plus a C compiler. Skipped on that one platform; vocal separation degrades
    # gracefully without it (#2081).
    "immich-memories[demucs]; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "immich-memories[editorial]",
]
# All features for macOS (adds the Metal probe)
all-mac = [
    "immich-memories[music]",
    "immich-memories[auth]",
    "immich-memories[demucs]; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "immich-memories[mac]",
    "immich-memories[editorial]",
]
dev = [
    "tokenizers>=0.23.3",  # Real portable Laya tokenizer in the lightweight unit suite.
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-benchmark>=5.3.0",
    "pytest-xdist>=3.5",
    "pillow-heif>=1.8.1",  # Encodes HEIC test inputs; pi-heif decodes only. Never shipped.
    "mypy>=2.4.0",
    "ruff>=0.17.1",
    "pre-commit>=3.0",
    "commitizen>=4.19.2",
    "python-semantic-release>=10.7.0",
    "types-PyYAML>=6.0",
    # Advanced quality gates
    "refurb>=2.0",
    "import-linter>=2.15",
    "grimp>=3.0",
    "deptry>=0.25.1",
    "diff-cover>=10.6.0",
    "oidc-provider-mock>=0.3",
    # E2E browser tests
    "pytest-playwright>=0.5",
    # Privacy audio tests (lightweight, no torch needed)
    "soundfile>=0.12",
    "hypothesis>=6.170.5",
]

[project.scripts]
immich-memories = "immich_memories.cli:main"

[project.urls]
Homepage = "https://github.com/sam-dumont/immich-memories"
Documentation = "https://sam-dumont.github.io/immich-memories/"
Repository = "https://github.com/sam-dumont/immich-memories"
Issues = "https://github.com/sam-dumont/immich-memories/issues"
Changelog = "https://github.com/sam-dumont/immich-memories/releases"

# WHY: the bundled-music package lives in this repo. Resolving it from the tree
# keeps `make dev`, CI and the Docker build working without waiting on a release
# to PyPI; published wheels resolve it from the index instead.
[tool.uv.sources]
immich-memories-music = { path = "packages/immich-memories-music" }

[tool.hatch.version]
source = "vcs"
# On non-tagged commits: 0.1.1.dev1+g1234567
# On tagged commits: 0.1.0

[tool.hatch.version.raw-options]
# Exact releases have no local suffix. Unreleased builds keep their commit identity.
local_scheme = "node-and-date"
tag_regex = '^v(?P<version>\d+\.\d+\.\d+(?:-(?:rc|dev)\.\d+)?)$'
# WHY --exclude: a dev rehearsal (#1940) tags v0.0.0-dev.<run id> on main, and setuptools-scm cannot
# add a distance to a .devN version, so every later build failed to compute its version.
scm.git.describe_command = "git describe --dirty --tags --long --match v[0-9]*.[0-9]*.[0-9]* --exclude *-dev.*"

[tool.hatch.build.hooks.vcs]
version-file = "src/immich_memories/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/immich_memories"]
# The built web client is gitignored (#1580); artifacts ship it anyway, and hatch_build.py
# refuses a standard wheel that would go out without it.
artifacts = ["src/immich_memories/web/client"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist]
# `uv build` makes the wheel from the sdist, so the sdist carries the built client too.
artifacts = ["src/immich_memories/web/client"]
include = [
    "/hatch_build.py",
    "/src",
    "/tests",
    "/web/src",
    "/web/package.json",
    "/web/package-lock.json",
    "/web/svelte.config.js",
    "/web/tsconfig.json",
    "/web/vite.config.ts",
]

# Semantic Release Configuration
[tool.semantic_release]
tag_format = "v{version}"
branch = "main"
build_command = "uv build"
commit_message = "chore(release): {version} [skip ci]"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches."rc"]
match = "rc/*"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.branches."dev"]
match = "(dev|develop|feature)/*"
prerelease = true
prerelease_token = "dev"

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    "^chore\\(release\\):",
    "^ci:",
    "^Merge",
]

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.semantic_release.publish]
upload_to_vcs_release = true
upload_to_pypi = false  # PyPI publishing handled by GitHub Actions trusted publishers

# Commitizen configuration for conventional commits
[tool.commitizen]
name = "cz_conventional_commits"
# Preserve Commitizen defaults and the release train's historical merge messages.
allowed_prefixes = ["Merge", "merge:", "Revert", "Pull request", "fixup!", "squash!", "amend!"]
tag_format = "v$version"
version_scheme = "semver"
version_provider = "scm"
update_changelog_on_bump = true
changelog_incremental = true
major_version_zero = true

[tool.uv]
# These distributions share the onnxruntime import namespace.
conflicts = [
    [{ extra = "editorial" }, { extra = "editorial-cuda" }],
    [{ extra = "all" }, { extra = "editorial-cuda" }],
    [{ extra = "all-mac" }, { extra = "editorial-cuda" }],
]
# Only resolve dependencies for the current platform to avoid cross-platform issues
# with platform-specific packages like pyobjc
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'", "sys_platform == 'win32'"]
# Security floors for transitive dependencies audited by the CI dev environment.
# Keep these as constraints instead of pretending they are direct application imports.
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "cryptography>=50.0.0",
    "filelock>=4.2.1",
    "gitpython>=3.2.1",
    "idna>=3.15",
    "joserfc>=1.6.8",
    "lxml>=6.1.0",
    "lxml-html-clean>=0.4.5",
    "python-multipart>=0.0.31",
    # quadrants requires setuptools>=77 at runtime, which put it in the audited
    # set for the first time; 80.10.2 is PYSEC-2026-3447, fixed in 83.0.0.
    "setuptools>=83.0.0",
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
    "yt-dlp>=2026.7.4",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "services/inference"]
exclude = [
    "src/immich_memories/_version.py",  # Auto-generated by hatch-vcs
    "vulture-whitelist.py",  # Generated by vulture --make-whitelist; not idiomatic Python
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "SIM105", # contextlib.suppress - often less readable
    "SIM115", # context manager for temp files - false positives with delete=False
    "ARG001", # unused function argument - often needed for interface compliance
    "ARG002", # unused method argument - often needed for interface compliance
    "B904",   # raise from - not always needed for simple re-raises
    "S603",   # subprocess call with non-literal args - we validate paths via security.py
    "S607",   # partial executable path - we use standard system binaries (ffmpeg, ffprobe)
    "S101",   # assert used - fine for non-security assertions in application code
    "S311",   # pseudo-random generators - not used for security purposes
    "S301",   # pickle - not used but would flag stdlib imports
    "S110",   # try-except-pass - used for cleanup/fallback paths
    "S112",   # try-except-continue - used for best-effort processing
]

[tool.ruff.lint.isort]
known-first-party = ["immich_memories", "immich_memories_inference"]

[tool.ruff.lint.per-file-ignores]
# mixer.py has bottom-of-file re-exports to avoid circular imports with mixer_helpers/mixer_class
"src/immich_memories/audio/mixer.py" = ["E402", "I001"]
# Tests use hardcoded /tmp paths as dummy values, not actual temp file usage
"tests/**" = ["S108"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["services/inference", "services/render-worker"]
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
strict = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# WHY: these modules import optional ML packages, so whether each ignore is
# needed depends on whether MLX, ACE-Step, torchcodec and demucs happen to be
# installed. Measured both ways: two ignores are unused with them present and
# required without, one is the other way round. warn_unused_ignores cannot be
# correct in both environments at once, so it is off for these files.
module = [
    "immich_memories.audio.generators.ace_step_runtime",
    "immich_memories.audio.generators.demucs_local",
    "immich_memories.analysis.audience.laya_reader",
]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "scenedetect.*",
    # macOS frameworks (PyObjC)
    "Metal.*",
    # Editorial preparation's encoder and detectors (optional, editorial extra).
    # CI installs only dev + gpu, so these imports must stay ignorable there
    # while still type-checking on a machine that has the extra.
    "torch.*",
    "onnxruntime",
    "onnxruntime.*",
    "kaldi_native_fbank",
    "kaldi_native_fbank.*",
    "huggingface_hub",
    "huggingface_hub.*",
    # The GPU title kernel library
    "quadrants",
    "quadrants.*",
    # Not-yet-implemented modules
    "immich_memories.cache.*",
    # Optional audio dependencies
    "soundfile.*",
    "demucs.*",
    "acestep.*",
    "loguru.*",
    # SDF font rendering
    "freetype.*",
    # PyAV (optional video processing)
    "av.*",
    # Streamlit runtime (optional UI)
    "streamlit.runtime.scriptrunner.*",
    # Map rendering (staticmap)
    "staticmap.*",
    # Geocoding (geopy)
    "geopy.*",
    # WordNet reader (nltk ships no type information)
    "nltk",
    "nltk.*",
]
ignore_missing_imports = true

# scipy lacks type stubs
# Optional: only installed with the `music` extra, so CI's dev-only env lacks it.
[[tool.mypy.overrides]]
module = ["immich_memories_music", "immich_memories_music.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

# OpenCV has incomplete type stubs, especially for CUDA
[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
ignore_missing_imports = true
ignore_errors = true

# Files using OpenCV CUDA functions with incomplete stubs
[[tool.mypy.overrides]]
module = [
    "immich_memories.analysis.scenes",
    "immich_memories.analysis.scoring",
    "immich_memories.analysis.face_scoring",
    "immich_memories.processing.scaling_utilities",
]
disable_error_code = ["attr-defined", "call-overload", "union-attr", "assignment", "misc", "has-type"]

# Audio mood analyzer with dynamic LLM outputs
[[tool.mypy.overrides]]
module = [
    "immich_memories.audio.content_analyzer",
]
disable_error_code = ["attr-defined", "assignment", "misc", "has-type"]

# Audio music generator with dynamic callbacks
[[tool.mypy.overrides]]
module = [
    "immich_memories.audio.music_generator",
    "immich_memories.audio.music_generator_client",
]
disable_error_code = ["valid-type", "misc", "call-arg"]

# Audio mixer with optional path types
[[tool.mypy.overrides]]
module = [
    "immich_memories.titles.renderer_kernels",
    "immich_memories.titles.kernel_blur",
    "immich_memories.titles.kernel_text",
    "immich_memories.titles.sdf_font",
    "immich_memories.titles.kernel_backend_probe",
    "immich_memories.titles.gpu_kernel_backend",
    "immich_memories.titles.kernels",
    "immich_memories.titles.sdf_font_rendering",
    "immich_memories.titles.kernel_video",
    "immich_memories.titles.hlg_kernel",
    "immich_memories.photos.move_kernels",
]
disable_error_code = ["valid-type", "assignment", "misc", "truthy-function", "union-attr", "import-untyped", "attr-defined", "has-type"]

# PIL renderer with optional font types
[[tool.mypy.overrides]]
module = [
    "immich_memories.titles.renderer_pil",
    "immich_memories.titles.ending_service",
]
disable_error_code = ["attr-defined", "arg-type", "union-attr", "has-type"]

# Title rendering service with optional kernel-library imports
[[tool.mypy.overrides]]
module = ["immich_memories.titles.rendering_service"]
disable_error_code = ["assignment", "misc", "attr-defined", "arg-type"]

# Title generator (dynamic backend typing)
[[tool.mypy.overrides]]
module = ["immich_memories.titles.generator"]
disable_error_code = ["assignment", "misc"]

# Analysis pipeline services (composed services with callback injection)
[[tool.mypy.overrides]]
module = [
    "immich_memories.analysis.clip_analyzer",
    "immich_memories.analysis.clip_refiner",
    "immich_memories.analysis.preview_builder",
    "immich_memories.analysis.analyzer_factory",
    "immich_memories.analysis.runtime.smart_pipeline",
]
disable_error_code = ["attr-defined", "arg-type", "return-value", "operator"]

# API services (callback-based request delegation)
[[tool.mypy.overrides]]
module = [
    "immich_memories.api.search_service",
    "immich_memories.api.sync_client",
]
disable_error_code = ["arg-type"]

# Pandas is optional for UI
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

# Cognitive complexity (complements cyclomatic complexity from xenon)
[tool.complexipy]
paths = ["src"]
max_complexity_allowed = 15
# complexipy 5.2 matches exclusions by basename, not path or glob.
# Reviewed over-threshold CLI/kernel functions remain visible in the snapshot.
exclude = ["_version.py"]

# Dependency hygiene
[tool.deptry]
exclude = ["tests", "docs", "scripts"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "itsdangerous", "python-multipart",                 # Loaded by Starlette/FastAPI, never imported
    "opencv-python",                                    # imported as cv2
    "pyyaml",                                           # imported as yaml
    "pillow",                                           # imported as PIL
    "pyobjc-framework-Metal",                           # macOS GPU, imported dynamically
    "freetype-py",                                      # imported as freetype
    "pytest", "pytest-cov", "pytest-asyncio",           # dev tools (CLI usage)
    "pytest-benchmark", "pytest-xdist", "pytest-playwright", # dev tools
    "hypothesis",                                       # property tests (tests/ is excluded)
    "pillow-heif",                                      # encodes HEIC test inputs (tests/ is excluded)
    "mypy", "ruff",                                      # dev tools
    "pre-commit", "commitizen",                         # dev tools
    "grimp",                                            # import-linter backend
    "refurb", "import-linter",                          # quality CLI tools
    "diff-cover", "deptry",                             # quality tools
    "python-semantic-release",                          # CI release tool
    "types-PyYAML",                                     # mypy stub
    "oidc-provider-mock",                               # auth: the OIDC tests' provider (tests/ is excluded)
    "psycopg",                                          # loaded by SQLAlchemy's postgresql+psycopg dialect
    "onnxruntime-gpu",                                  # editorial-cuda: the CUDA variant of the ONNX seats
    "opentelemetry-api", "opentelemetry-sdk",           # imported as the `opentelemetry` namespace
    "opentelemetry-exporter-otlp-proto-http",           # likewise
    "opentelemetry-instrumentation-fastapi",            # likewise
    "opentelemetry-instrumentation-httpx",              # likewise
    "opentelemetry-instrumentation-sqlalchemy",         # likewise
]
DEP001 = [
    "cv2",                                              # alt-name import
    "yaml", "acestep",                                  # alt-name import; ACE-Step out of band
    # Optional: local audio pipeline. `torch` arrives with `demucs` and with the
    # ACE-Step stack installed out of band; nothing in this project declares it
    # any more, now that both detector seats are ONNX graphs.
    "torch", "loguru",
    "mlx", "safetensors",                               # Optional: owned ACE-Step MLX/weight path
    "laya_mlx",                                         # Optional: Laya audience pre-screen, out of band
    "PIL", "freetype", "streamlit",                     # Alt package names (Pillow→PIL)
    "starlette",                                        # Transitive via fastapi→starlette
    "opentelemetry",                                    # namespace of the opentelemetry-* packages
]
DEP003 = ["starlette"]  # Known transitive import

# Architectural boundaries
[tool.importlinter]
root_packages = ["immich_memories", "immich_memories_inference"]
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "inference-service-is-headless"
name = "The inference service must not import the UI or the CLI"
type = "forbidden"
source_modules = ["immich_memories_inference"]
forbidden_modules = ["immich_memories.web", "immich_memories.cli"]

[[tool.importlinter.contracts]]
id = "no-service-in-app"
name = "The app must not import the inference service"
type = "forbidden"
source_modules = ["immich_memories"]
forbidden_modules = ["immich_memories_inference"]

[[tool.importlinter.contracts]]
id = "no-cli-in-core"
name = "Core must not import CLI"
type = "forbidden"
source_modules = [
    "immich_memories.analysis",
    "immich_memories.config",
    "immich_memories.processing",
    "immich_memories.titles",
    "immich_memories.audio",
    "immich_memories.people",
    "immich_memories.store",
    "immich_memories.triage",
    "immich_memories.operations",
    "immich_memories.free_text",
]
forbidden_modules = ["immich_memories.cli"]

[[tool.importlinter.contracts]]
id = "web-runs-the-cli-never-imports-it"
name = "The web server runs the CLI as a child process and never imports it"
type = "forbidden"
source_modules = ["immich_memories.web"]
forbidden_modules = ["immich_memories.cli"]

[[tool.importlinter.contracts]]
id = "no-web-in-core"
name = "Core must not import the web server"
type = "forbidden"
source_modules = [
    "immich_memories.analysis",
    "immich_memories.config",
    "immich_memories.processing",
    "immich_memories.titles",
    "immich_memories.people",
    "immich_memories.store",
    "immich_memories.triage",
    "immich_memories.operations",
    "immich_memories.cache",
    "immich_memories.tracking",
    "immich_memories.free_text",
]
forbidden_modules = ["immich_memories.web"]

[[tool.importlinter.contracts]]
id = "analysis-stages-are-layered"
name = "Each analysis stage imports only the stages below it"
type = "layers"
containers = ["immich_memories.analysis"]
# Top to bottom: composition, then the film's structure down to the model transport.
layers = [
    "runtime",
    "structure",
    "polish",
    "selection",
    "stories",
    "film",
    "audience",
    "special_days",
    "reading",
    "preparation",
    "captions",
    "clips",
    "facts",
    "sources",
    "corpus",
    "places",
    "judgments",
    "llm",
]
ignore_imports = [
    # Loading a config derives the caption identity from the caption contract, so config (which
    # every stage imports) reads two caption modules; that is not a stage depending on captions.
    "immich_memories.config.tiers -> immich_memories.analysis.captions.identity",
    "immich_memories.config.models.editorial -> immich_memories.analysis.captions.contract",
    # The shared timing policy is built from the run's GenerationParams and title settings,
    # imported lazily from the orchestrator modules above every stage.
    "immich_memories.processing.editorial_timing -> immich_memories.generate",
    "immich_memories.processing.editorial_timing -> immich_memories.generate_settings",
]

[tool.refurb]
# FURB184 (chained assignments) is a style preference — config + result = func(config)
# is more readable than result = func(MockConfig()) in tests
ignore = [
    "FURB184",  # chained assignments: config + result is more readable
    "FURB110",  # X if X else Y: false positive on Linux with similar variable names
]
# refurb sees src/ layout modules twice — only scan the package, not src/
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The inference service is its own top-level package: it runs in its own image,
# beside the app rather than inside it. The image puts it on PYTHONPATH; the
# suite resolves it from the tree the same way.
pythonpath = ["services/inference"]
asyncio_mode = "auto"
markers = [
    "integration: requires FFmpeg (deselect with '-m not integration')",
    "kernel_thread: runs on the kernel library's own thread (calls kernels directly)",
    "extras: needs the torch-family optional dependencies (demucs/editorial)",
    "e2e: Playwright E2E browser tests (deselect with '-m not e2e')",
    "slow: long-running tests (full generation pipeline, ~10min)",
    "perf: performance benchmarks (run with: make benchmark-perf)",
    "demo: renders a docs demo asset (run with: make demo-output)",
    "install_checks: meets the real pre-run install checks instead of an install that ran models fetch",
    "real_mounts: reads this machine's own mount table instead of the suite's local one",
    "container: runs the built image through docker compose (run with: make test-container)",
    "feature(id): checks an advertised feature, by its row id in tests/features/inventory.yaml (make feature-check)",
    "fake_immich_only(reason): a feature test only the fake Immich can drive; the real-Immich pass skips it with the reason",
    "real_immich_only: a feature test that needs a real Immich (make test-features-real-immich); the fake pass skips it",
]
# `-p no:quadrants`: the quadrants distribution registers a pytest11 plugin, so
# merely having it installed pulls its C++ runtime into every pytest session,
# including the thousands of tests that never touch a kernel. The app imports it
# in exactly one place and nowhere near collection time; blocking the plugin
# keeps it that way, and is a no-op where the wheel does not exist.
addopts = "-p no:quadrants -m 'not integration and not e2e and not container'"

[tool.coverage.run]
source = ["src/immich_memories", "services/inference/immich_memories_inference"]
branch = true

[tool.coverage.report]
# Unit tests alone reach ~67%. Integration XMLs push higher.
# This floor prevents erosion — the REAL check is diff-cover at 80% per PR.
fail_under = 65
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",  # Protocol stubs
    # A kernel body is compiled by the kernel library and run on the device;
    # the Python interpreter never executes those lines, so coverage counts
    # every one of them as missed however hard the pixel tests exercise them.
    "@ti\\.kernel",
]
